<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> -->
  <title>Docker Monitor</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <script>
    // 修复国内无法访问 gstatic.com 的问题：强制使用本地 CanvasKit
    // 通过拦截 _flutter.loader 实现对 load() 调用的 canvasKitBaseUrl 注入
    (() => {
      const _flutterObj = {};
      let _realLoader = null;
      Object.defineProperty(_flutterObj, 'loader', {
        configurable: true,
        enumerable: true,
        get() { return _realLoader; },
        set(v) {
          _realLoader = v;
          if (v && v.load) {
            const _origLoad = v.load;
            v.load = function(opts) {
              opts = opts || {};
              opts.config = opts.config || {};
              // 强制使用本地 canvaskit 目录，避免从 gstatic.com CDN 加载
              opts.config.canvasKitBaseUrl = opts.config.canvasKitBaseUrl || 'canvaskit';
              // 使用自定义 SW：把 fonts.gstatic.com 字体请求改写为同源 /fonts/
              // （后端磁盘持久化缓存代理，未命中才回源 gstatic 下载）
              opts.serviceWorkerSettings = opts.serviceWorkerSettings || {};
              opts.serviceWorkerSettings.serviceWorkerUrl = 'font_proxy_service_worker.js';
              return _origLoad.call(this, opts);
            };
          }
        }
      });
      window._flutter = _flutterObj;
    })();
  </script>
  <script>
    // 首帧优化：按 flutter loader 的 renderer 决策，提前 preload 将要使用的
    // wasm（与 main.dart.js 并行下载，避免串行等待）。判断逻辑与
    // flutter_bootstrap.js 保持一致：
    //   - 支持 WasmGC → dart2wasm + skwasm（Chrome/Edge 用 skwasm.wasm，
    //     其余支持 WasmGC 的浏览器用 skwasm_heavy.wasm）
    //   - 不支持 WasmGC → dart2js + canvaskit（Chrome/Edge 用
    //     chromium/canvaskit.wasm，其余用 canvaskit.wasm）
    // 若未来 loader 决策变化导致 preload 偏差，仅损失一次冗余下载，
    // 不影响功能。
    (() => {
      // WasmGC 检测（与 flutter_bootstrap.js 相同的魔法字节序列）
      const wasmGC = WebAssembly.validate(
        new Uint8Array([0, 0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]));
      const isBlink = navigator.vendor === "Google Inc." ||
        navigator.userAgent.includes("Edg/");
      const hasImageCodecs = typeof ImageDecoder !== "undefined" && isBlink;
      const hasBreakIterators = typeof Intl.v8BreakIterator !== "undefined" &&
        typeof Intl.Segmenter !== "undefined";
      const fullCanvasKit = hasImageCodecs && hasBreakIterators;
      const wasmFile = wasmGC
        ? (fullCanvasKit ? 'skwasm.wasm' : 'skwasm_heavy.wasm')
        : (fullCanvasKit && isBlink ? 'chromium/canvaskit.wasm' : 'canvaskit.wasm');
      const link = document.createElement('link');
      link.rel = 'preload';
      link.href = 'canvaskit/' + wasmFile;
      link.as = 'fetch';
      link.crossOrigin = 'anonymous';
      document.head.appendChild(link);
    })();
  </script>
  <script src="autofill_hints.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
