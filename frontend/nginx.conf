server {
    listen       80;
    server_name  localhost;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # API 反向代理到后端
    location /admin {
        proxy_pass http://mobile_portainer-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /containers {
        proxy_pass http://mobile_portainer-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /images {
        proxy_pass http://mobile_portainer-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /networks {
        proxy_pass http://mobile_portainer-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /volumes {
        proxy_pass http://mobile_portainer-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /projects {
        proxy_pass http://mobile_portainer-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /stacks {
        proxy_pass http://mobile_portainer-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 备份与恢复 API
    location /backups {
        proxy_pass http://mobile_portainer-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket
    location /ws {
        proxy_pass http://mobile_portainer-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # 系统信息 API
    location /info {
        proxy_pass http://mobile_portainer-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /self {
        proxy_pass http://mobile_portainer-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /git {
        proxy_pass http://mobile_portainer-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /usage {
        proxy_pass http://mobile_portainer-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /ports {
        proxy_pass http://mobile_portainer-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Docker Engine API 代理
    location /v1. {
        proxy_pass http://mobile_portainer-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # MCP Streamable HTTP 端点（供 AI 助手管理 Docker）
    # proxy_pass 带 /mcp/ 尾路径：将 /mcp 重写为 /mcp/ 转发，
    # 避免 FastAPI mount 对无尾斜杠请求返回 307 重定向
    # （MCP 客户端不跟随重定向，且 307 location 会丢失端口/协议）
    location /mcp {
        proxy_pass http://mobile_portainer-api:8000/mcp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # MCP Streamable HTTP 使用 SSE 长连接
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # MCP OAuth 2.0 认证端点（MCP_AUTH_ENABLED=true 时由 MCP SDK 在根路径注册）
    # 缺失时这些路径被下方 `location /`（SPA 回退）捕获：
    #   POST /register 等 → nginx 对静态文件拒绝 POST → 405 Not Allowed
    #   GET /.well-known/  → 返回 Flutter index.html 而非 JSON
    # Claude Code 的 OAuth 认证流程因此断裂（实测 405）。
    # 正则 location 合并 /register|/authorize|/token|/revoke（proxy_pass
    # 不带 URI，请求原样转发；正则 location 不能配带 URI 的 proxy_pass）；
    # ^~ 前缀匹配保护 /.well-known/（OAuth discovery + 资源元数据）。
    location ~ ^/(register|authorize|token|revoke)(/|$) {
        proxy_pass http://mobile_portainer-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /.well-known/ {
        proxy_pass http://mobile_portainer-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 跨实例服务器授权添加（/connect 流程：交互式授权页 + PKCE token 交换）。
    # 注意：老版本 nginx 无此 location 时，/connect/* 会被下方 SPA 回退
    # 捕获（GET 返回 index.html / POST 405），源 app 靠
    # GET /connect/capabilities 解析 JSON 失败探测到并回退手动输入。

    # /connect 授权回跳：由前端 SPA 处理（main.dart 启动时解析
    # code/state，换取独立 apikey 并添加服务器）。精确匹配优先级高于
    # 下方 location /connect/（后端代理），否则回调被代理到后端
    # FastAPI（无该路由）→ 404 {"detail":"Not Found"}。
    location = /connect/callback {
        root   /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location /connect/ {
        proxy_pass http://mobile_portainer-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Google Fonts 字体缓存代理：Service Worker 将 fonts.gstatic.com
    # 请求改写为同源 /fonts/{path}，由后端磁盘持久化缓存（未命中才回源）
    # ⚠️ proxy_pass 主机名必须用下划线 mobile_portainer-api（与
    # Dockerfile.cn/web 的 sed pattern 一致），否则 All-in-One 镜像内
    # nginx 启动报 host not found in upstream（流水线 425 实测）。
    location /fonts {
        proxy_pass http://mobile_portainer-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI 文档
    location /docs {
        proxy_pass http://mobile_portainer-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://mobile_portainer-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://mobile_portainer-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Flutter 静态资源 — 长缓存
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /icons/ {
        alias /usr/share/nginx/html/icons/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /canvaskit/ {
        alias /usr/share/nginx/html/canvaskit/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 回退
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }
}
