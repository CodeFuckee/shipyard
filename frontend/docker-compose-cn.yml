version: '3.8'

services:
  api:
    image: mobile_portainer-api:latest
    environment:
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-password}
      # OIDC 统一身份认证（必要变量不全时后端自动保持未启用）
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URIS=${OIDC_REDIRECT_URIS:-}
      - OIDC_DISCOVERY_TIMEOUT=${OIDC_DISCOVERY_TIMEOUT:-10}
      - IGNORED_EVENTS=${IGNORED_EVENTS:-exec_create,exec_start,exec_die}
      - HOST_FILESYSTEM_ROOT=/hostfs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - /:/hostfs:ro
      - /proc:/hostfs/proc:ro
    restart: unless-stopped
    container_name: mobile-portainer-api

  web:
    build:
      context: .
      dockerfile: Dockerfile.web.cn
      args:
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - HTTP_PROXY=${HTTP_PROXY:-}
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
    container_name: mobile-portainer-web