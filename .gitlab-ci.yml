# ================================================================
# Shipyard 统一 CI/CD 流水线
#
# 涵盖前端 (Flutter) 和后端 (Python FastAPI) 的全部检查、测试、
# 构建和部署任务。各阶段内部最大化并行执行，部署阶段等待所有
# 上游任务通过后才触发。
#
# Stage 拓扑：
#   check ─┬─ build ─┬─ test ─┬─ deploy
#           │          │         │
#   前后端独立并行      前端 Selenium  汇总部署
# ================================================================

stages:
  - check
  - build
  - test
  - deploy

# ================================================================
# 全局变量（前后端合并去重）
# ================================================================
variables:
  GIT_CLEAN_FLAGS: none

  # ----------------------------------------------------------
  # 前端 —— 路径 / SDK 变量
  # ----------------------------------------------------------
  HVIGOR_USER_HOME: 'C:\hvigor_home'
  NODEJS_HOME: 'D:\nodejs'
  HOS_SDK_HOME: '/home/ckd/hos-sdk'

  # ----------------------------------------------------------
  # 前端 —— 镜像 / 注册表地址
  # ----------------------------------------------------------
  NODEJS_VERSION: 'v20.18.0'
  NODEJS_DOWNLOAD_URL: 'https://npmmirror.com/mirrors/node'
  PUB_HOSTED_URL: 'https://pub.flutter-io.cn'
  FLUTTER_STORAGE_BASE_URL: 'https://storage.flutter-io.cn'
  NPM_REGISTRY_URL: 'https://registry.npmmirror.com'

  # ----------------------------------------------------------
  # 前端 —— 行为开关
  # ----------------------------------------------------------
  HVIGOR_USER_HOME_AUTO_CREATE: 'true'
  NODEJS_AUTO_INSTALL: 'true'

  # ----------------------------------------------------------
  # 后端 —— 镜像 / 注册表地址
  # ----------------------------------------------------------
  PIP_INDEX_URL: "https://pypi.tuna.tsinghua.edu.cn/simple"

  # ----------------------------------------------------------
  # 后端 —— 构建变量（All-in-One 镜像）
  # ----------------------------------------------------------
  API_IMAGE_NAME: "shipyard"
  IMAGE_TAG: "latest"
  WEB_DOWNLOAD_BASE: "https://github.com"

  # ----------------------------------------------------------
  # 部署变量（All-in-One docker-compose 方式）
  # ----------------------------------------------------------
  WEB_PORT: '8080'

  # 管理凭据
  ADMIN_USER: "admin"
  ADMIN_PASSWORD: "password"

# ================================================================
# 公共配置
# ================================================================

# --- 前端公共配置 ---
.frontend_setup:
  before_script:
    - cd frontend
    - |
      set +e
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      echo "CI env: PUB_HOSTED_URL = $PUB_HOSTED_URL"
      export HOS_SDK_HOME="${HOS_SDK_HOME:-/home/ckd/hos-sdk}"
      export PATH="$HOME/flutter/bin:$HOME/fvm/default/bin:/usr/local/flutter/bin:$PATH"
      echo "PATH setup done"

# --- 后端公共配置 ---
.backend_setup:
  before_script:
    - cd backend
    - |
      set +e
      echo "=== 环境信息 ==="
      echo "CI_PROJECT_DIR: $CI_PROJECT_DIR"
      echo "Python 版本: $(python3 --version 2>/dev/null || echo '未安装')"
      echo "Docker 版本: $(docker --version 2>/dev/null || echo '未安装')"

# ================================================================
# Stage: check —— 前后端静态检查 & 单元测试（并行）
# ================================================================

# --- 前端：Flutter 静态分析 + 单元测试 ---
frontend:analyze:
  extends: .frontend_setup
  stage: check
  tags:
    - harmony
    - flutter
  script:
    - JOB_START_TIME=$(date +%s)
    - flutter pub get
    - flutter analyze --no-fatal-warnings --no-fatal-infos
    - flutter test
    - |
      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [frontend:analyze] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="

# --- 后端：Python 单元测试（使用 uv 高速包管理器）---
# 在 gitlab-runner 机器（code01）上直接运行（shell executor），
# 不依赖 Docker，不再调度到 NAS 上执行。
backend:test:
  extends: .backend_setup
  stage: check
  tags:
    - linux
    - code01
  timeout: 40m
  cache:
    key: uv-cache-${CI_COMMIT_REF_SLUG}
    paths:
      - backend/.uv-cache/
    policy: pull-push
  script:
    - JOB_START_TIME=$(date +%s)
    - |
      set -e

      # uv 缓存目录（CI 缓存持久化，加速后续构建）
      export UV_CACHE_DIR="$CI_PROJECT_DIR/backend/.uv-cache"

      STEP1_START=$(date +%s)
      echo "=== 1. 安装 uv（Rust 实现的高速 Python 包管理器）==="
      # PEP 668 保护阻止系统级 pip install，使用 --break-system-packages
      # CI 环境不是生产系统，此操作安全
      pip install uv -i ${PIP_INDEX_URL} -q --break-system-packages 2>/dev/null || \
        curl -LsSf https://astral.sh/uv/install.sh | sh
      # 确保 uv 在 PATH 中
      export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
      STEP1_END=$(date +%s)
      echo "⏱️  步骤1 (安装 uv) 用时: $((STEP1_END - STEP1_START)) 秒"

      STEP2_START=$(date +%s)
      echo "=== 2. 创建虚拟环境 ==="
      # shell executor 工作目录跨 job 持久化，先清理旧的 .venv
      rm -rf .venv
      uv venv .venv
      PYTHON=".venv/bin/python"
      STEP2_END=$(date +%s)
      echo "⏱️  步骤2 (创建虚拟环境) 用时: $((STEP2_END - STEP2_START)) 秒"

      STEP3_START=$(date +%s)
      echo "=== 3. 安装项目依赖（uv 并行下载+安装，比 pip 快 10-100 倍）==="
      uv pip install -r requirements.txt -i ${PIP_INDEX_URL}
      STEP3_END=$(date +%s)
      echo "⏱️  步骤3 (安装项目依赖) 用时: $((STEP3_END - STEP3_START)) 秒"

      STEP4_START=$(date +%s)
      echo "=== 4. 运行 pytest ==="
      $PYTHON -m pytest tests/ -v --tb=short
      STEP4_END=$(date +%s)
      echo "⏱️  步骤4 (运行 pytest) 用时: $((STEP4_END - STEP4_START)) 秒"

      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [backend:test] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="
      echo ""
      echo "========== 各步骤耗时汇总 =========="
      echo "  步骤1 (安装 uv):          $((STEP1_END - STEP1_START)) 秒"
      echo "  步骤2 (创建虚拟环境):     $((STEP2_END - STEP2_START)) 秒"
      echo "  步骤3 (安装项目依赖):     $((STEP3_END - STEP3_START)) 秒"
      echo "  步骤4 (运行 pytest):      $((STEP4_END - STEP4_START)) 秒"
      echo "========================================="
  coverage: '/TOTAL.*\s+(\d+%)$/'

# ================================================================
# Stage: build —— 前端 Web 构建 & 后端 Docker 镜像（并行）
# ================================================================

# --- 前端：Flutter build web（提供 Selenium 测试 & 部署产物）---
frontend:build_web:
  extends: .frontend_setup
  stage: build
  tags:
    - harmony
    - flutter
  needs:
    - job: frontend:analyze
  script:
    - JOB_START_TIME=$(date +%s)
    - flutter pub get
    - flutter build web --no-tree-shake-icons --no-wasm-dry-run
    - |
      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [frontend:build_web] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="
  artifacts:
    paths:
      - frontend/build/web
    expire_in: 1 day

# --- 后端：构建 All-in-One Docker 镜像（runner 编译前端 + Python + nginx）---
backend:build_images:
  extends: .backend_setup
  stage: build
  tags:
    - linux
    - docker
    - nas
  needs:
    - job: backend:test
    # 前端 Web 产物由 frontend:build_web 在 runner 机器上编译，通过 artifacts 传入
    - job: frontend:build_web
      artifacts: true
  timeout: 60m
  script:
    - JOB_START_TIME=$(date +%s) && echo "$JOB_START_TIME" > /tmp/job_start_time_${CI_JOB_ID}.txt
    - echo "=== 检查前端构建产物 ==="
    # artifact 下载到仓库根目录；.backend_setup 已 cd backend，所以用 ../ 访问
    - ls -la ../frontend/build/web/index.html
    - echo "=== 预拉取基础镜像 ==="
    - docker pull docker.1ms.run/python:3.11-slim
    - echo "=== 构建 All-in-One 镜像 ==="
    # 使用项目根目录的 All-in-One Dockerfile.cn（含 nginx + supervisord），
    # 而非 backend/Dockerfile.cn（纯后端，无 nginx）。
    # Flutter 前端已由 frontend:build_web 编译（不在 Docker 内编译），
    # Dockerfile.cn 直接 COPY frontend/build/web 产物。
    # .backend_setup 会 cd backend，所以用 ../ 回到项目根目录。
    - docker build --progress=plain -f ../Dockerfile.cn --build-arg PIP_INDEX_URL=${PIP_INDEX_URL} -t ${API_IMAGE_NAME}:${IMAGE_TAG} -t ${API_IMAGE_NAME}:latest ..
    - echo "=== 镜像列表 ==="
    - docker images | grep ${API_IMAGE_NAME}
    - |
      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [backend:build_images] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="
  after_script:
    - |
      if [ -f /tmp/job_start_time_${CI_JOB_ID}.txt ]; then
        JOB_END_TIME=$(date +%s)
        JOB_START_TIME=$(cat /tmp/job_start_time_${CI_JOB_ID}.txt)
        DURATION=$((JOB_END_TIME - JOB_START_TIME))
        echo "========================================="
        echo "⏱️  [backend:build_images] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
        echo "========================================="
        rm -f /tmp/job_start_time_${CI_JOB_ID}.txt
      fi
      echo "构建完成"
      echo "  All-in-One 镜像: ${API_IMAGE_NAME}:${IMAGE_TAG}"

# ================================================================
# Stage: test —— 前端 Selenium E2E 测试
# 在 gitlab-runner 机器（code01）上直接运行（shell executor），
# 不依赖 Docker，与 backend:test 相同模式。
# ================================================================

frontend:selenium_tests:
  stage: test
  timeout: 40m
  tags:
    - linux
    - code01
  needs:
    - job: frontend:build_web
      artifacts: true
    - job: frontend:analyze
  cache:
    key: uv-cache-frontend-${CI_COMMIT_REF_SLUG}
    paths:
      - frontend/.uv-cache/
    policy: pull-push
  before_script:
    - cd frontend/selenium_tests
    - |
      set +e
      echo "=== 环境信息 ==="
      echo "CI_PROJECT_DIR: $CI_PROJECT_DIR"
      echo "Python 版本: $(python3 --version 2>/dev/null || echo '未安装')"
      CHROMIUM_BIN=$(command -v chromium || command -v chromium-browser || command -v google-chrome)
      echo "Chromium 版本: $($CHROMIUM_BIN --version 2>/dev/null || echo '未安装')"
      echo "ChromeDriver 版本: $(chromedriver --version 2>/dev/null || echo '未安装')"
  script:
    - JOB_START_TIME=$(date +%s) && echo "$JOB_START_TIME" > /tmp/job_start_time_${CI_JOB_ID}.txt
    - |
      set -e

      # uv 缓存目录（CI 缓存持久化，加速后续构建）
      export UV_CACHE_DIR="$CI_PROJECT_DIR/frontend/.uv-cache"

      STEP1_START=$(date +%s)
      echo "=== 1. 验证前端构建产物 ==="
      # artifact 下载到仓库根目录；before_script 已 cd frontend/selenium_tests
      ls -la ../build/web/index.html
      STEP1_END=$(date +%s)
      echo "⏱️  步骤1 (验证构建产物) 用时: $((STEP1_END - STEP1_START)) 秒"

      STEP2_START=$(date +%s)
      echo "=== 2. 安装 uv（Rust 实现的高速 Python 包管理器）==="
      # PEP 668 保护阻止系统级 pip install，使用 --break-system-packages
      # CI 环境不是生产系统，此操作安全
      pip install uv -i ${PIP_INDEX_URL} -q --break-system-packages 2>/dev/null || \
        curl -LsSf https://astral.sh/uv/install.sh | sh
      # 确保 uv 在 PATH 中
      export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
      STEP2_END=$(date +%s)
      echo "⏱️  步骤2 (安装 uv) 用时: $((STEP2_END - STEP2_START)) 秒"

      STEP3_START=$(date +%s)
      echo "=== 3. 创建虚拟环境 ==="
      # shell executor 工作目录跨 job 持久化，先清理旧的 .venv
      rm -rf .venv
      uv venv .venv
      PYTHON=".venv/bin/python"
      STEP3_END=$(date +%s)
      echo "⏱️  步骤3 (创建虚拟环境) 用时: $((STEP3_END - STEP3_START)) 秒"

      STEP4_START=$(date +%s)
      echo "=== 4. 安装项目依赖 ==="
      uv pip install -r requirements.txt -i ${PIP_INDEX_URL}
      STEP4_END=$(date +%s)
      echo "⏱️  步骤4 (安装项目依赖) 用时: $((STEP4_END - STEP4_START)) 秒"

      STEP5_START=$(date +%s)
      echo "=== 5. 准备浏览器环境 + 启动 mock backend ==="
      # 优先使用系统非 snap 版浏览器；snap 版 Chromium 在 CI/headless
      # 环境无法启动（Chrome instance exited），需改用下载的 CfT 版本
      SNAP_DETECTED=false
      if [ -x /snap/bin/chromium ]; then
        SNAP_DETECTED=true
        echo "  -> 检测到 snap 版 Chromium（CI 环境不可用），改用 Chrome for Testing"
      fi

      if [ "$SNAP_DETECTED" = false ]; then
        if command -v chromium >/dev/null 2>&1; then
          export CHROMIUM_BINARY=$(command -v chromium)
        elif command -v chromium-browser >/dev/null 2>&1; then
          export CHROMIUM_BINARY=$(command -v chromium-browser)
        elif command -v google-chrome >/dev/null 2>&1; then
          export CHROMIUM_BINARY=$(command -v google-chrome)
        fi
        if command -v chromedriver >/dev/null 2>&1; then
          export CHROMEDRIVER_PATH=$(command -v chromedriver)
        fi
      fi

      if [ -z "$CHROMIUM_BINARY" ]; then
        # 下载 Chrome for Testing（npmmirror 镜像，国内可访问）。
        # 浏览器与 chromedriver 同版本打包，天然匹配。
        # 下载目录位于 CI_PROJECT_DIR 下，shell executor 工作目录跨 job
        # 持久化，仅首次 job 需要下载（约 170MB）。
        CHROME_DIR="$CI_PROJECT_DIR/frontend/.chrome"
        CHROME_VER="150.0.7871.124"
        if [ ! -x "$CHROME_DIR/chrome-linux64/chrome" ]; then
          echo "  -> 下载 Chrome for Testing ${CHROME_VER}（仅首次）..."
          rm -rf "$CHROME_DIR"
          mkdir -p "$CHROME_DIR"
          curl -fL --retry 3 "https://registry.npmmirror.com/-/binary/chrome-for-testing/${CHROME_VER}/linux64/chrome-linux64.zip" -o /tmp/cft-chrome.zip
          curl -fL --retry 3 "https://registry.npmmirror.com/-/binary/chrome-for-testing/${CHROME_VER}/linux64/chromedriver-linux64.zip" -o /tmp/cft-driver.zip
          python3 -m zipfile -e /tmp/cft-chrome.zip "$CHROME_DIR"
          python3 -m zipfile -e /tmp/cft-driver.zip "$CHROME_DIR"
          chmod +x "$CHROME_DIR/chrome-linux64/chrome" "$CHROME_DIR/chromedriver-linux64/chromedriver"
          rm -f /tmp/cft-chrome.zip /tmp/cft-driver.zip
        fi
        export CHROMIUM_BINARY="$CHROME_DIR/chrome-linux64/chrome"
        export CHROMEDRIVER_PATH="$CHROME_DIR/chromedriver-linux64/chromedriver"
        # 验证下载的 Chrome 可运行（系统可能缺少依赖库）
        "$CHROMIUM_BINARY" --version || {
          echo "FATAL: Chrome for Testing 无法运行，code01 系统可能缺少依赖库："
          echo "  sudo apt-get install -y libnss3 libgbm1 libasound2 libatk-bridge2.0-0 libatk1.0-0 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libcups2 libpango-1.0-0 libdrm2 libxcb-cursor0"
          exit 1
        }
      fi
      echo "CHROMIUM_BINARY=$CHROMIUM_BINARY"
      echo "CHROMEDRIVER_PATH=$CHROMEDRIVER_PATH"

      # 清理可能残留的旧 mock backend（job 重试 / 上次异常退出）
      if [ -f "/tmp/mock_backend_pid_${CI_JOB_ID}.txt" ]; then
        kill "$(cat /tmp/mock_backend_pid_${CI_JOB_ID}.txt)" 2>/dev/null || true
        rm -f "/tmp/mock_backend_pid_${CI_JOB_ID}.txt"
      fi

      # 启动 mock backend（提供 Flutter Web 静态文件 + Portainer API mock）
      export MOCK_BACKEND_PORT=9000
      nohup $PYTHON mock_backend.py > "/tmp/mock_backend_${CI_JOB_ID}.log" 2>&1 &
      MOCK_PID=$!
      echo "$MOCK_PID" > "/tmp/mock_backend_pid_${CI_JOB_ID}.txt"
      echo "mock backend PID: $MOCK_PID，端口: $MOCK_BACKEND_PORT"

      # 等待 mock backend 就绪
      MOCK_READY=false
      for i in $(seq 1 30); do
        if curl -sf "http://localhost:${MOCK_BACKEND_PORT}/info" > /dev/null 2>&1; then
          echo "✓ mock backend 就绪 (${i}s)"
          MOCK_READY=true
          break
        fi
        sleep 1
      done
      if [ "$MOCK_READY" = false ]; then
        echo "FATAL: mock backend 启动失败，日志如下："
        tail -30 "/tmp/mock_backend_${CI_JOB_ID}.log" 2>/dev/null
        exit 1
      fi
      STEP5_END=$(date +%s)
      echo "⏱️  步骤5 (启动 mock backend) 用时: $((STEP5_END - STEP5_START)) 秒"

      STEP6_START=$(date +%s)
      echo "=== 6. 运行 pytest ==="
      set +e  # 禁用 exit-on-error，确保测试失败时也能执行清理
      export TEST_BASE_URL="http://localhost:${MOCK_BACKEND_PORT}"
      export MOCK_BACKEND_URL="http://localhost:${MOCK_BACKEND_PORT}"
      export TEST_BROWSER=chrome
      export TEST_HEADLESS=true
      # 避免本地代理干扰 ChromeDriver ↔ Chromium 通信
      export NO_PROXY="localhost,127.0.0.1,::1"
      export no_proxy="$NO_PROXY"

      REPORT_DIR="reports"
      rm -rf "$REPORT_DIR"
      mkdir -p "$REPORT_DIR"

      $PYTHON -m pytest tests/ -v --tb=long --html="$REPORT_DIR/report.html" --self-contained-html
      TEST_EXIT=$?
      set -e
      STEP6_END=$(date +%s)
      echo "⏱️  步骤6 (运行 pytest) 用时: $((STEP6_END - STEP6_START)) 秒"

      # 无论测试成功与否，都清理 mock backend
      if [ -f "/tmp/mock_backend_pid_${CI_JOB_ID}.txt" ]; then
        MOCK_PID=$(cat "/tmp/mock_backend_pid_${CI_JOB_ID}.txt")
        kill "$MOCK_PID" 2>/dev/null || true
        rm -f "/tmp/mock_backend_pid_${CI_JOB_ID}.txt"
      fi

      echo "Reports directory contents:"
      ls -la "$REPORT_DIR/" 2>/dev/null || echo "  (empty)"

      # 恢复原始测试退出码
      if [ $TEST_EXIT -ne 0 ]; then
        echo "Tests FAILED with exit code $TEST_EXIT"
        exit $TEST_EXIT
      fi
      echo "Tests PASSED"
    - |
      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [frontend:selenium_tests] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="
      echo ""
      echo "========== 各步骤耗时汇总 =========="
      echo "  步骤1 (验证构建产物):            $((STEP1_END - STEP1_START)) 秒"
      echo "  步骤2 (安装 uv):                 $((STEP2_END - STEP2_START)) 秒"
      echo "  步骤3 (创建虚拟环境):            $((STEP3_END - STEP3_START)) 秒"
      echo "  步骤4 (安装项目依赖):            $((STEP4_END - STEP4_START)) 秒"
      echo "  步骤5 (启动 mock backend):       $((STEP5_END - STEP5_START)) 秒"
      echo "  步骤6 (运行 pytest):             $((STEP6_END - STEP6_START)) 秒"
      echo "========================================="

  after_script:
    - |
      if [ -f /tmp/job_start_time_${CI_JOB_ID}.txt ]; then
        JOB_END_TIME=$(date +%s)
        JOB_START_TIME=$(cat /tmp/job_start_time_${CI_JOB_ID}.txt)
        DURATION=$((JOB_END_TIME - JOB_START_TIME))
        echo "========================================="
        echo "⏱️  [frontend:selenium_tests] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
        echo "========================================="
        rm -f /tmp/job_start_time_${CI_JOB_ID}.txt
      fi
    - |
      # 兜底清理：确保 mock backend 进程不残留（script 正常执行时已清理）
      if [ -f "/tmp/mock_backend_pid_${CI_JOB_ID}.txt" ]; then
        MOCK_PID=$(cat "/tmp/mock_backend_pid_${CI_JOB_ID}.txt")
        kill "$MOCK_PID" 2>/dev/null || true
        rm -f "/tmp/mock_backend_pid_${CI_JOB_ID}.txt"
      fi
  artifacts:
    when: always
    paths:
      - frontend/selenium_tests/reports/report.html
    expire_in: 7 days

# ================================================================
# Stage: deploy —— All-in-One 部署（构建镜像 + 启动容器分开）
# ================================================================
deploy_to_synology:
  stage: deploy
  tags:
    - docker
    - nas
    - deploy
  needs:
    - job: frontend:selenium_tests
    - job: backend:build_images
    # fallback 构建需要前端产物（Dockerfile.cn 不再在容器内编译 Flutter）
    - job: frontend:build_web
      artifacts: true
  before_script:
    - |
      set +e
      echo "=== Docker 环境检查 ==="
      docker --version || { echo "错误：Docker CLI 不可用"; exit 1; }

      # ----------------------------------------------------------
      # 诊断：当前用户、socket 权限
      # ----------------------------------------------------------
      echo "当前用户: $(whoami), uid=$(id -u), groups=$(id -Gn)"
      echo "docker.sock 状态:"
      ls -la /var/run/docker.sock 2>/dev/null || echo "  /var/run/docker.sock 不存在"

      # ----------------------------------------------------------
      # 按优先级尝试 Docker 连接方式
      # ----------------------------------------------------------
      DOCKER="docker"
      if docker info >/dev/null 2>&1; then
        echo "✓ Docker daemon 连接正常（直接访问）"
      elif sudo -n chmod 666 /var/run/docker.sock 2>/dev/null && docker info >/dev/null 2>&1; then
        echo "✓ 通过 sudo 修复 socket 权限后连接正常"
      elif sudo -n docker info >/dev/null 2>&1; then
        DOCKER="sudo docker"
        echo "✓ Docker daemon 通过 sudo docker 连接正常"
      else
        echo ""
        echo "================================================"
        echo "错误：无法连接 Docker daemon！"
        echo ""
        echo "请在 NAS 上以 root 身份 SSH 执行以下命令："
        echo ""
        echo "  # 将 gitlab-runner 加入 docker 组（推荐方案）"
        echo "  sudo synogroup --add docker 2>/dev/null || true"
        echo "  sudo synogroup --member docker gitlab-runner"
        echo "  sudo chown root:docker /var/run/docker.sock"
        echo "  sudo chmod 660 /var/run/docker.sock"
        echo "  sudo systemctl restart gitlab-runner"
        echo ""
        echo "  # 备选方案：配置免密 sudo"
        echo "  echo 'gitlab-runner ALL=(ALL) NOPASSWD:/usr/local/bin/docker' > /etc/sudoers.d/gitlab-runner"
        echo "  chmod 440 /etc/sudoers.d/gitlab-runner"
        echo "================================================"
        exit 1
      fi

      echo "工作目录：$CI_PROJECT_DIR"
      echo "All-in-One 部署模式：docker build（构建）→ docker run（启动）"
  script:
    - |
      JOB_START_TIME=$(date +%s)

      # ================================================================
      # 第 1 步：清理旧的分离部署容器（向下兼容）
      # ================================================================
      echo "=== 1. 清理旧的分离部署容器 ==="
      $DOCKER stop mobile-portainer-web 2>/dev/null || true
      $DOCKER rm mobile-portainer-web 2>/dev/null || true
      $DOCKER stop mobile-portainer-api 2>/dev/null || true
      $DOCKER rm mobile-portainer-api 2>/dev/null || true

      # ================================================================
      # 第 2 步：停止旧的 all-in-one 容器
      # ================================================================
      echo "=== 2. 停止旧的 shipyard 容器 ==="
      $DOCKER stop shipyard 2>/dev/null || true
      $DOCKER rm shipyard 2>/dev/null || true

      # ================================================================
      # 第 3 步：检查端口占用
      # ================================================================
      echo "=== 3. 检查端口 ${WEB_PORT:-8080} 占用 ==="
      PORT_PID=$($DOCKER ps --filter "publish=${WEB_PORT:-8080}" --format '{{.ID}}' 2>/dev/null || true)
      if [ -n "$PORT_PID" ]; then
        echo "端口 ${WEB_PORT:-8080} 被容器 $PORT_PID 占用，正在清理..."
        $DOCKER stop $PORT_PID 2>/dev/null || true
        $DOCKER rm $PORT_PID 2>/dev/null || true
      else
        echo "端口 ${WEB_PORT:-8080} 未被占用"
      fi

      # ================================================================
      # 第 4 步：使用 backend:build_images 在同一台 NAS 上已构建的
      #          All-in-One 镜像（shipyard:latest）
      # ================================================================
      echo "=== 4. 使用 All-in-One 镜像 ==="
      DEPLOY_IMAGE="${API_IMAGE_NAME}:${IMAGE_TAG}"
      if $DOCKER images -q ${DEPLOY_IMAGE} >/dev/null 2>&1; then
        echo "✓ 镜像 ${DEPLOY_IMAGE} 已存在（由 backend:build_images 构建），直接部署"
      else
        # 镜像不存在才回退到本机构建；前端产物已由 frontend:build_web 的
        # artifacts 传入（Dockerfile.cn 不再在容器内编译 Flutter）
        if [ ! -f frontend/build/web/index.html ]; then
          echo "错误：缺少前端构建产物 frontend/build/web，无法构建镜像"
          exit 1
        fi
        echo "镜像不存在，执行构建..."
        $DOCKER build -f Dockerfile.cn \
          --build-arg PIP_INDEX_URL=${PIP_INDEX_URL} \
          -t ${DEPLOY_IMAGE} \
          . || { echo "错误：Docker 镜像构建失败"; exit 1; }
      fi

      echo "可用镜像："
      $DOCKER images | grep ${API_IMAGE_NAME}

      # ================================================================
      # 第 5 步：启动 All-in-One 容器
      # ================================================================
      # 映射到 nginx（容器内 80 端口），由 nginx 代理 API 到本地 uvicorn（127.0.0.1:8000）
      echo "=== 5. 启动 shipyard 容器 ==="
      $DOCKER run -d \
        --name shipyard \
        --restart unless-stopped \
        -p ${WEB_PORT:-8080}:80 \
        -e ADMIN_USER=${ADMIN_USER:-admin} \
        -e ADMIN_PASSWORD=${ADMIN_PASSWORD:-password} \
        -e IGNORED_EVENTS=${IGNORED_EVENTS:-exec_create,exec_start,exec_die} \
        -e HOST_FILESYSTEM_ROOT=/hostfs \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v /volume2/docker/mobile_portainer/data:/app/data \
        -v /:/hostfs:ro \
        -v /proc:/hostfs/proc:ro \
        ${DEPLOY_IMAGE} || { echo "错误：容器启动失败"; exit 1; }

      # ================================================================
      # 第 6 步：等待服务就绪
      # ================================================================
      echo "=== 6. 等待服务就绪 ==="
      sleep 5
      HEALTHY=false
      for i in $(seq 1 12); do
        if curl -sf http://localhost:${WEB_PORT:-8080} > /dev/null 2>&1; then
          echo "✓ 服务就绪 (${i}s)"
          HEALTHY=true
          break
        fi
        echo "  等待中... (${i}s)"
        sleep 1
      done

      # ================================================================
      # 第 7 步：验证部署结果
      # ================================================================
      echo "=== 7. 验证部署 ==="
      if [ "$HEALTHY" = true ]; then
        echo "✓ 部署成功！应用运行在 http://<synology-ip>:${WEB_PORT:-8080}"
        echo ""
        echo "=== 容器状态 ==="
        $DOCKER ps --filter "name=shipyard" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
      else
        echo "警告：容器已启动但 HTTP 健康检查未通过"
        echo ""
        echo "=== 容器状态 ==="
        $DOCKER ps -a --filter "name=shipyard" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
        echo ""
        echo "=== 容器日志（最后 30 行）==="
        $DOCKER logs shipyard --tail 30 2>/dev/null || true
      fi

      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [deploy_to_synology] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="
