# ================================================================
# Shipyard 统一 CI/CD 流水线
#
# 涵盖前端 (Flutter) 和后端 (Python FastAPI) 的全部检查、测试、
# 构建和部署任务。各阶段内部最大化并行执行，部署阶段等待所有
# 上游任务通过后才触发。
#
# Stage 拓扑：
#   check ─┬─ build ─┬─ test ─┬─ deploy
#           │          │         │
#   前后端独立并行      前端 Selenium  汇总部署
# ================================================================

stages:
  - check
  - build
  - test
  - deploy

# ================================================================
# 全局变量（前后端合并去重）
# ================================================================
variables:
  GIT_CLEAN_FLAGS: none

  # ----------------------------------------------------------
  # 前端 —— 路径 / SDK 变量
  # ----------------------------------------------------------
  HVIGOR_USER_HOME: 'C:\hvigor_home'
  NODEJS_HOME: 'D:\nodejs'
  HOS_SDK_HOME: '/home/ckd/hos-sdk'

  # ----------------------------------------------------------
  # 前端 —— 镜像 / 注册表地址
  # ----------------------------------------------------------
  NODEJS_VERSION: 'v20.18.0'
  NODEJS_DOWNLOAD_URL: 'https://npmmirror.com/mirrors/node'
  PUB_HOSTED_URL: 'https://pub.flutter-io.cn'
  FLUTTER_STORAGE_BASE_URL: 'https://storage.flutter-io.cn'
  NPM_REGISTRY_URL: 'https://registry.npmmirror.com'

  # ----------------------------------------------------------
  # 前端 —— 行为开关
  # ----------------------------------------------------------
  HVIGOR_USER_HOME_AUTO_CREATE: 'true'
  NODEJS_AUTO_INSTALL: 'true'

  # ----------------------------------------------------------
  # 后端 —— 镜像 / 注册表地址
  # ----------------------------------------------------------
  PIP_INDEX_URL: "https://pypi.tuna.tsinghua.edu.cn/simple"

  # ----------------------------------------------------------
  # 后端 —— 构建变量（All-in-One 镜像）
  # ----------------------------------------------------------
  API_IMAGE_NAME: "shipyard"
  IMAGE_TAG: "latest"
  WEB_DOWNLOAD_BASE: "https://github.com"

  # ----------------------------------------------------------
  # 部署变量（All-in-One docker-compose 方式）
  # ----------------------------------------------------------
  WEB_PORT: '8080'

  # 管理凭据
  ADMIN_USER: "admin"
  ADMIN_PASSWORD: "password"

# ================================================================
# 公共配置
# ================================================================

# --- 前端公共配置 ---
.frontend_setup:
  before_script:
    - cd frontend
    - |
      set +e
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      echo "CI env: PUB_HOSTED_URL = $PUB_HOSTED_URL"
      export HOS_SDK_HOME="${HOS_SDK_HOME:-/home/ckd/hos-sdk}"
      export PATH="$HOME/flutter/bin:$HOME/fvm/default/bin:/usr/local/flutter/bin:$PATH"
      echo "PATH setup done"

# --- 后端公共配置 ---
.backend_setup:
  before_script:
    - cd backend
    - |
      set +e
      echo "=== 环境信息 ==="
      echo "CI_PROJECT_DIR: $CI_PROJECT_DIR"
      echo "Python 版本: $(python3 --version 2>/dev/null || echo '未安装')"
      echo "Docker 版本: $(docker --version 2>/dev/null || echo '未安装')"

# ================================================================
# Stage: check —— 前后端静态检查 & 单元测试（并行）
# ================================================================

# --- 前端：Flutter 静态分析 + 单元测试 ---
frontend:analyze:
  extends: .frontend_setup
  stage: check
  tags:
    - harmony
    - flutter
  script:
    - JOB_START_TIME=$(date +%s)
    - flutter pub get
    - flutter analyze --no-fatal-warnings --no-fatal-infos
    - flutter test
    - |
      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [frontend:analyze] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="

# --- 后端：Python 单元测试（使用 uv 高速包管理器）---
backend:test:
  extends: .backend_setup
  stage: check
  tags:
    - linux
    - docker
  timeout: 40m
  cache:
    key: uv-cache-${CI_COMMIT_REF_SLUG}
    paths:
      - backend/.uv-cache/
    policy: pull-push
  script:
    - JOB_START_TIME=$(date +%s)
    - |
      set -e

      # uv 缓存目录（CI 缓存持久化，加速后续构建）
      export UV_CACHE_DIR="$CI_PROJECT_DIR/backend/.uv-cache"

      STEP1_START=$(date +%s)
      echo "=== 1. 安装 uv（Rust 实现的高速 Python 包管理器）==="
      # PEP 668 保护阻止系统级 pip install，使用 --break-system-packages
      # CI 环境不是生产系统，此操作安全
      pip install uv -i ${PIP_INDEX_URL} -q --break-system-packages 2>/dev/null || \
        curl -LsSf https://astral.sh/uv/install.sh | sh
      # 确保 uv 在 PATH 中
      export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
      STEP1_END=$(date +%s)
      echo "⏱️  步骤1 (安装 uv) 用时: $((STEP1_END - STEP1_START)) 秒"

      STEP2_START=$(date +%s)
      echo "=== 2. 创建虚拟环境 ==="
      # shell executor 工作目录跨 job 持久化，先清理旧的 .venv
      rm -rf .venv
      uv venv .venv
      PYTHON=".venv/bin/python"
      STEP2_END=$(date +%s)
      echo "⏱️  步骤2 (创建虚拟环境) 用时: $((STEP2_END - STEP2_START)) 秒"

      STEP3_START=$(date +%s)
      echo "=== 3. 安装项目依赖（uv 并行下载+安装，比 pip 快 10-100 倍）==="
      uv pip install -r requirements.txt -i ${PIP_INDEX_URL}
      STEP3_END=$(date +%s)
      echo "⏱️  步骤3 (安装项目依赖) 用时: $((STEP3_END - STEP3_START)) 秒"

      STEP4_START=$(date +%s)
      echo "=== 4. 运行 pytest ==="
      $PYTHON -m pytest tests/ -v --tb=short
      STEP4_END=$(date +%s)
      echo "⏱️  步骤4 (运行 pytest) 用时: $((STEP4_END - STEP4_START)) 秒"

      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [backend:test] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="
      echo ""
      echo "========== 各步骤耗时汇总 =========="
      echo "  步骤1 (安装 uv):          $((STEP1_END - STEP1_START)) 秒"
      echo "  步骤2 (创建虚拟环境):     $((STEP2_END - STEP2_START)) 秒"
      echo "  步骤3 (安装项目依赖):     $((STEP3_END - STEP3_START)) 秒"
      echo "  步骤4 (运行 pytest):      $((STEP4_END - STEP4_START)) 秒"
      echo "========================================="
  coverage: '/TOTAL.*\s+(\d+%)$/'

# ================================================================
# Stage: build —— 前端 Web 构建 & 后端 Docker 镜像（并行）
# ================================================================

# --- 前端：Flutter build web（提供 Selenium 测试 & 部署产物）---
frontend:build_web:
  extends: .frontend_setup
  stage: build
  tags:
    - harmony
    - flutter
  needs:
    - job: frontend:analyze
  script:
    - JOB_START_TIME=$(date +%s)
    - flutter pub get
    - flutter build web --no-tree-shake-icons --no-wasm-dry-run
    - |
      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [frontend:build_web] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="
  artifacts:
    paths:
      - frontend/build/web
    expire_in: 1 day

# --- 后端：构建 All-in-One Docker 镜像（runner 编译前端 + Python + nginx）---
backend:build_images:
  extends: .backend_setup
  stage: build
  tags:
    - linux
    - docker
    - nas
  needs:
    - job: backend:test
    # 前端 Web 产物由 frontend:build_web 在 runner 机器上编译，通过 artifacts 传入
    - job: frontend:build_web
      artifacts: true
  timeout: 60m
  script:
    - JOB_START_TIME=$(date +%s) && echo "$JOB_START_TIME" > /tmp/job_start_time_${CI_JOB_ID}.txt
    - echo "=== 检查前端构建产物 ==="
    # artifact 下载到仓库根目录；.backend_setup 已 cd backend，所以用 ../ 访问
    - ls -la ../frontend/build/web/index.html
    - echo "=== 预拉取基础镜像 ==="
    - docker pull docker.1ms.run/python:3.11-slim
    - echo "=== 构建 All-in-One 镜像 ==="
    # 使用项目根目录的 All-in-One Dockerfile.cn（含 nginx + supervisord），
    # 而非 backend/Dockerfile.cn（纯后端，无 nginx）。
    # Flutter 前端已由 frontend:build_web 编译（不在 Docker 内编译），
    # Dockerfile.cn 直接 COPY frontend/build/web 产物。
    # .backend_setup 会 cd backend，所以用 ../ 回到项目根目录。
    - docker build --progress=plain -f ../Dockerfile.cn --build-arg PIP_INDEX_URL=${PIP_INDEX_URL} -t ${API_IMAGE_NAME}:${IMAGE_TAG} -t ${API_IMAGE_NAME}:latest ..
    - echo "=== 镜像列表 ==="
    - docker images | grep ${API_IMAGE_NAME}
    - |
      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [backend:build_images] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="
  after_script:
    - |
      if [ -f /tmp/job_start_time_${CI_JOB_ID}.txt ]; then
        JOB_END_TIME=$(date +%s)
        JOB_START_TIME=$(cat /tmp/job_start_time_${CI_JOB_ID}.txt)
        DURATION=$((JOB_END_TIME - JOB_START_TIME))
        echo "========================================="
        echo "⏱️  [backend:build_images] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
        echo "========================================="
        rm -f /tmp/job_start_time_${CI_JOB_ID}.txt
      fi
      echo "构建完成"
      echo "  All-in-One 镜像: ${API_IMAGE_NAME}:${IMAGE_TAG}"

# ================================================================
# Stage: test —— 前端 Selenium E2E 测试
# ================================================================

frontend:selenium_tests:
  stage: test
  timeout: 40m
  tags:
    - linux
    - docker
    - selenium
  needs:
    - job: frontend:build_web
      artifacts: true
    - job: frontend:analyze
  before_script:
    - cd frontend
  script:
    - JOB_START_TIME=$(date +%s) && echo "$JOB_START_TIME" > /tmp/job_start_time_${CI_JOB_ID}.txt
    # 所有 Docker 命令的输出重定向到 /tmp 文件，而非 GitLab Runner trace。
    # 原因：Runner 19.1.1 的 shell executor 在捕获大量 Docker 输出时
    # 存在 trace 缓冲区死锁 bug，导致 job 在 ~12 秒时被杀。
    # 仅保留 echo 里程碑输出给 trace 查看进度。
    - STEP0_START=$(date +%s)
    - echo "step0 start"
    - docker --version
    - echo "step0.1 docker diagnostics"
    - docker images --format '{{.Repository}}:{{.Tag}}' 2>/dev/null | sort
    - echo "DOCKER_HOST=$DOCKER_HOST"
    - STEP0_END=$(date +%s)
    - echo "step0 docker diagnostics took $((STEP0_END - STEP0_START))s"
    - STEP1_START=$(date +%s)
    - echo "step1 verify"
    - ls -la build/web/index.html
    - STEP1_END=$(date +%s)
    - echo "step1 verify build took $((STEP1_END - STEP1_START))s"
    - STEP2_START=$(date +%s)
    - echo "step2 cleanup"
    - docker rm -f selenium_app 2>/dev/null || true
    - STEP2_END=$(date +%s)
    - echo "step2 cleanup took $((STEP2_END - STEP2_START))s"
    - STEP3_START=$(date +%s)
    - echo "step3 build app image (docker commit 方案)"
    - docker rm -f tmp_app tmp_test 2>/dev/null || true
    - |
      echo "  -> 创建临时容器..."
      docker run --name tmp_app -d docker.1ms.run/python:3.11-slim sleep 3600
      echo "  -> 创建目录并复制文件..."
      docker exec tmp_app mkdir -p /app/build/web /app/selenium_tests
      docker cp build/web/. tmp_app:/app/build/web/
      docker cp selenium_tests/mock_backend.py tmp_app:/app/selenium_tests/
      echo "  -> 验证容器内文件..."
      docker exec tmp_app ls -la /app/build/web/index.html
      docker exec tmp_app ls -la /app/selenium_tests/mock_backend.py
      echo "  -> 提交为 selenium_app 镜像..."
      docker commit --change='WORKDIR /app' --change='EXPOSE 9000' --change='CMD ["python3", "selenium_tests/mock_backend.py"]' tmp_app selenium_app:latest
      docker rm -f tmp_app
    - echo "step3 done"
    - STEP3_END=$(date +%s)
    - echo "step3 build app image took $((STEP3_END - STEP3_START))s"
    - STEP4_START=$(date +%s)
    - echo "step4 build test image (docker commit 方案)"
    - |
      echo "  -> 创建临时容器..."
      docker run --name tmp_test -d docker.1ms.run/python:3.11-slim sleep 3600
      echo "  -> 安装 Chromium 及依赖库（约 2-3 分钟）..."
      docker exec tmp_test sh -c "sed -i 's|http://deb.debian.org|http://mirrors.tuna.tsinghua.edu.cn|g' /etc/apt/sources.list.d/debian.sources && apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends chromium chromium-driver libegl1 libgles2 libgl1 libgl1-mesa-dri libgbm1 libdrm2 libxkbcommon0 libnss3 libnspr4 libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0 libcups2 libpango-1.0-0 libasound2 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 fonts-liberation libvulkan1 mesa-vulkan-drivers && rm -rf /var/lib/apt/lists/*"
      echo "  -> 复制测试代码..."
      docker exec tmp_test mkdir -p /app
      docker cp selenium_tests/. tmp_test:/app/
      echo "  -> 安装 Python 依赖..."
      docker exec tmp_test sh -c "PIP_PROGRESS_BAR=off pip install --quiet --no-cache-dir -i https://pypi.tuna.tsinghua.edu.cn/simple selenium pytest webdriver-manager pytest-html"
      echo "  -> 提交为 selenium_tests 镜像..."
      docker commit --change='WORKDIR /app' --change='ENV WDM_PROGRESS_BAR=0' tmp_test selenium_tests:latest
      docker rm -f tmp_test
    - echo "step4 done"
    - STEP4_END=$(date +%s)
    - echo "step4 build test image took $((STEP4_END - STEP4_START))s"
    - STEP5_START=$(date +%s)
    - echo "step5 start app with dynamic port + internal health check"
    - |
      # ================================================================
      # 端口分配 + 容器启动 + 内部健康检查
      #
      # 关键设计：
      # 1. 通过 docker ps 收集宿主机已占用端口（docker daemon 视角）
      # 2. docker run -p 绑定端口 — 既是端口分配也是实际使用，无竞态
      # 3. docker exec 做内部健康检查 — 不依赖宿主机端口映射，100% 可靠
      # 4. 外部 curl 作为辅助验证（后续 step6）
      # ================================================================

      docker rm -f selenium_app 2>/dev/null || true

      # 收集宿主机 Docker 已占用的端口
      HOST_USED=$(docker ps --format '{{.Ports}}' 2>/dev/null \
        | tr ',' '\n' \
        | grep -oP ':\K[0-9]+(?=->)' \
        | sort -u)

      MAX_ATTEMPTS=15
      STARTED=false
      attempt=1

      while [ $attempt -le $MAX_ATTEMPTS ]; do
        # ---- 生成候选端口，避开 docker ps 已知占用 ----
        PORT=$(python3 -c "import random; print(random.randint(10000, 60000))" 2>/dev/null \
          || echo $((10000 + RANDOM % 50000)))

        # 跳过已知被 Docker 占用的端口
        if echo "$HOST_USED" | grep -qxF "$PORT"; then
          attempt=$((attempt + 1))
          continue
        fi

        echo "[attempt $attempt] trying host port $PORT"

        # ---- 启动 app 容器 ----
        err_log=$(mktemp)
        if ! docker run -d --name selenium_app -p ${PORT}:9000 selenium_app 2>"$err_log"; then
          if grep -qiE 'port.*already.*allocated|bind.*failed|address already in use' "$err_log"; then
            echo "  -> port $PORT occupied on host, retrying..."
            docker rm -f selenium_app 2>/dev/null || true
            rm -f "$err_log"
            attempt=$((attempt + 1))
            continue
          else
            echo "FATAL: docker run failed (non-port error):"
            cat "$err_log"
            rm -f "$err_log"
            exit 1
          fi
        fi
        rm -f "$err_log"

        # ---- 立即检查容器是否还活着 ----
        sleep 2
        STATUS=$(docker inspect -f '{{.State.Status}}' selenium_app 2>/dev/null)
        if [ "$STATUS" != "running" ]; then
          echo "  -> container exited (status=$STATUS), checking logs:"
          docker logs selenium_app 2>&1 | tail -20
          echo "  -> container exited unexpectedly, retrying..."
          docker rm -f selenium_app 2>/dev/null || true
          attempt=$((attempt + 1))
          continue
        fi

        # ---- 内部健康检查：docker exec 不依赖端口映射 ----
        INTERNAL_OK=false
        for i in $(seq 1 15); do
          if docker exec selenium_app python3 -c "
      import urllib.request
      try:
          resp = urllib.request.urlopen('http://localhost:9000/info', timeout=3)
          print(resp.status)
      except Exception as e:
          print(f'ERROR: {e}')
      " 2>/dev/null | grep -q '200'; then
            echo "  -> app healthy (internal check) at ${i}s"
            INTERNAL_OK=true
            break
          fi
          sleep 1
        done

        if [ "$INTERNAL_OK" = true ]; then
          SELENIUM_PORT=$PORT
          STARTED=true
          echo "  -> app running on internal:9000, mapped to host:$SELENIUM_PORT"
          break
        fi

        echo "  -> internal health check TIMEOUT, container logs:"
        docker logs selenium_app 2>&1 | tail -20
        docker rm -f selenium_app 2>/dev/null || true
        attempt=$((attempt + 1))
      done

      if [ "$STARTED" = false ]; then
        echo "FATAL: failed to start selenium_app after $MAX_ATTEMPTS attempts"
        exit 1
      fi
      echo "SELENIUM_PORT=$SELENIUM_PORT"
    - STEP5_END=$(date +%s)
    - echo "step5 start app + health check took $((STEP5_END - STEP5_START))s"
    - STEP6_START=$(date +%s)
    - echo "step6 external health check"
    - |
      # ================================================================
      # 外部健康检查：从 CI shell 通过端口映射访问 app
      # 注意：此步骤仅用于诊断，不影响后续测试！
      # 测试容器通过 --network container: 共享网络命名空间，
      # 内部 localhost:9000 始终可达。
      # ================================================================

      set +e  # 此步骤的任何失败都不应中断 job

      # 尝试 1: localhost
      if curl -sf "http://localhost:${SELENIUM_PORT}/info" > /dev/null 2>&1; then
        echo "app reachable via localhost:${SELENIUM_PORT}"
      else
        echo "localhost:${SELENIUM_PORT} not reachable"

        # 尝试 2: Docker 网桥网关（兼容 busybox/synology，优先试用 route 命令）
        GATEWAY=""
        if command -v ip >/dev/null 2>&1; then
          GATEWAY=$(ip route 2>/dev/null | awk '/default/ {print $3; exit}')
        elif command -v route >/dev/null 2>&1; then
          GATEWAY=$(route -n 2>/dev/null | awk '$1=="0.0.0.0" {print $2; exit}')
        fi

        if [ -n "$GATEWAY" ] && curl -sf "http://${GATEWAY}:${SELENIUM_PORT}/info" > /dev/null 2>&1; then
          echo "app reachable via gateway ${GATEWAY}:${SELENIUM_PORT}"
        else
          echo "WARNING: external health check skipped"
          echo "  container status: $(docker inspect -f '{{.State.Status}}' selenium_app 2>/dev/null || echo unknown)"
          echo "  container ports:  $(docker port selenium_app 2>/dev/null || echo unknown)"
          echo "  Tests use --network container: mode (independent of host port mapping)"
        fi
      fi

      set -e
    - STEP6_END=$(date +%s)
    - echo "step6 external health check took $((STEP6_END - STEP6_START))s"
    - STEP7_START=$(date +%s)
    - echo "step7 run tests"
    - |
      # ================================================================
      # 不使用 Docker bind mount（-v）！
      #
      # 原因：当 Docker daemon 运行在容器中或不同挂载命名空间时
      # （如 Docker-in-Docker、远程 Docker socket、Synology Docker），
      # bind mount 的源路径需要在 Docker daemon 宿主机上存在，
      # 而非 GitLab Runner 的文件系统上。
      #
      # 解决方案：pytest 报告写入容器内部 /tmp/reports/，
      # 测试完成后通过 docker cp 提取到 Runner 文件系统。
      # docker cp 通过 Docker API 流式传输，不依赖宿主文件系统路径。
      # ================================================================

      set +e  # 禁用 exit-on-error，确保测试失败时也能提取报告

      REPORT_DIR="$CI_PROJECT_DIR/frontend/selenium_tests/reports"
      rm -rf "$REPORT_DIR" 2>/dev/null || true
      mkdir -p "$REPORT_DIR"

      TEST_CONTAINER="selenium_test_runner"
      docker rm -f "$TEST_CONTAINER" 2>/dev/null || true

      # 运行测试（不使用 --rm，以便测试后通过 docker cp 提取报告）
      # --network container:selenium_app 共享网络命名空间，
      # 因此内部 localhost:9000 始终可达，不受宿主机端口映射影响。
      docker run --shm-size=2g \
        --name "$TEST_CONTAINER" \
        --network container:selenium_app \
        -e TEST_BASE_URL=http://localhost:9000 \
        -e MOCK_BACKEND_URL=http://localhost:9000 \
        -e TEST_BROWSER=chrome \
        -e TEST_HEADLESS=true \
        -e CHROMIUM_BINARY=/usr/bin/chromium \
        -e CHROMEDRIVER_PATH=/usr/bin/chromedriver \
        selenium_tests sh -c '
          mkdir -p /tmp/reports && \
          pytest tests/ -v --tb=long --html=/tmp/reports/report.html --self-contained-html
        '
      TEST_EXIT=$?

      # 无论测试成功与否，都提取报告
      echo "Extracting test reports from container..."
      docker cp "$TEST_CONTAINER:/tmp/reports/." "$REPORT_DIR/" 2>/dev/null || {
        echo "Warning: Could not copy reports from container"
        echo "Container logs (last 20 lines):"
        docker logs "$TEST_CONTAINER" 2>/dev/null | tail -20 || true
      }

      # 清理测试容器
      docker rm -f "$TEST_CONTAINER" 2>/dev/null || true

      echo "Reports directory contents:"
      ls -la "$REPORT_DIR/" 2>/dev/null || echo "  (empty)"

      # 恢复原始测试退出码
      if [ $TEST_EXIT -ne 0 ]; then
        echo "Tests FAILED with exit code $TEST_EXIT"
        exit $TEST_EXIT
      fi
      echo "Tests PASSED"
    - STEP7_END=$(date +%s)
    - echo "step7 run tests took $((STEP7_END - STEP7_START))s"
    - echo "step8 done"
    - |
      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [frontend:selenium_tests] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="
      echo ""
      echo "========== 各步骤耗时汇总 =========="
      echo "  step0 (docker diagnostics):         $((STEP0_END - STEP0_START)) 秒"
      echo "  step1 (验证构建产物):               $((STEP1_END - STEP1_START)) 秒"
      echo "  step2 (清理旧容器):                 $((STEP2_END - STEP2_START)) 秒"
      echo "  step3 (构建 app 镜像):              $((STEP3_END - STEP3_START)) 秒"
      echo "  step4 (构建 test 镜像):             $((STEP4_END - STEP4_START)) 秒"
      echo "  step5 (启动 app + 健康检查):        $((STEP5_END - STEP5_START)) 秒"
      echo "  step6 (外部健康检查):               $((STEP6_END - STEP6_START)) 秒"
      echo "  step7 (运行测试):                   $((STEP7_END - STEP7_START)) 秒"
      echo "========================================="
  after_script:
    - |
      if [ -f /tmp/job_start_time_${CI_JOB_ID}.txt ]; then
        JOB_END_TIME=$(date +%s)
        JOB_START_TIME=$(cat /tmp/job_start_time_${CI_JOB_ID}.txt)
        DURATION=$((JOB_END_TIME - JOB_START_TIME))
        echo "========================================="
        echo "⏱️  [frontend:selenium_tests] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
        echo "========================================="
        rm -f /tmp/job_start_time_${CI_JOB_ID}.txt
      fi
    - docker rm -f selenium_test_runner 2>/dev/null || true
    - docker stop selenium_app 2>/dev/null || true
    - docker rm -f selenium_app 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - frontend/selenium_tests/reports/report.html
    expire_in: 7 days

# ================================================================
# Stage: deploy —— All-in-One 部署（构建镜像 + 启动容器分开）
# ================================================================
deploy_to_synology:
  stage: deploy
  tags:
    - docker
    - nas
    - deploy
  needs:
    - job: frontend:selenium_tests
    - job: backend:build_images
    # fallback 构建需要前端产物（Dockerfile.cn 不再在容器内编译 Flutter）
    - job: frontend:build_web
      artifacts: true
  before_script:
    - |
      set +e
      echo "=== Docker 环境检查 ==="
      docker --version || { echo "错误：Docker CLI 不可用"; exit 1; }

      # ----------------------------------------------------------
      # 诊断：当前用户、socket 权限
      # ----------------------------------------------------------
      echo "当前用户: $(whoami), uid=$(id -u), groups=$(id -Gn)"
      echo "docker.sock 状态:"
      ls -la /var/run/docker.sock 2>/dev/null || echo "  /var/run/docker.sock 不存在"

      # ----------------------------------------------------------
      # 按优先级尝试 Docker 连接方式
      # ----------------------------------------------------------
      DOCKER="docker"
      if docker info >/dev/null 2>&1; then
        echo "✓ Docker daemon 连接正常（直接访问）"
      elif sudo -n chmod 666 /var/run/docker.sock 2>/dev/null && docker info >/dev/null 2>&1; then
        echo "✓ 通过 sudo 修复 socket 权限后连接正常"
      elif sudo -n docker info >/dev/null 2>&1; then
        DOCKER="sudo docker"
        echo "✓ Docker daemon 通过 sudo docker 连接正常"
      else
        echo ""
        echo "================================================"
        echo "错误：无法连接 Docker daemon！"
        echo ""
        echo "请在 NAS 上以 root 身份 SSH 执行以下命令："
        echo ""
        echo "  # 将 gitlab-runner 加入 docker 组（推荐方案）"
        echo "  sudo synogroup --add docker 2>/dev/null || true"
        echo "  sudo synogroup --member docker gitlab-runner"
        echo "  sudo chown root:docker /var/run/docker.sock"
        echo "  sudo chmod 660 /var/run/docker.sock"
        echo "  sudo systemctl restart gitlab-runner"
        echo ""
        echo "  # 备选方案：配置免密 sudo"
        echo "  echo 'gitlab-runner ALL=(ALL) NOPASSWD:/usr/local/bin/docker' > /etc/sudoers.d/gitlab-runner"
        echo "  chmod 440 /etc/sudoers.d/gitlab-runner"
        echo "================================================"
        exit 1
      fi

      echo "工作目录：$CI_PROJECT_DIR"
      echo "All-in-One 部署模式：docker build（构建）→ docker run（启动）"
  script:
    - |
      JOB_START_TIME=$(date +%s)

      # ================================================================
      # 第 1 步：清理旧的分离部署容器（向下兼容）
      # ================================================================
      echo "=== 1. 清理旧的分离部署容器 ==="
      $DOCKER stop mobile-portainer-web 2>/dev/null || true
      $DOCKER rm mobile-portainer-web 2>/dev/null || true
      $DOCKER stop mobile-portainer-api 2>/dev/null || true
      $DOCKER rm mobile-portainer-api 2>/dev/null || true

      # ================================================================
      # 第 2 步：停止旧的 all-in-one 容器
      # ================================================================
      echo "=== 2. 停止旧的 shipyard 容器 ==="
      $DOCKER stop shipyard 2>/dev/null || true
      $DOCKER rm shipyard 2>/dev/null || true

      # ================================================================
      # 第 3 步：检查端口占用
      # ================================================================
      echo "=== 3. 检查端口 ${WEB_PORT:-8080} 占用 ==="
      PORT_PID=$($DOCKER ps --filter "publish=${WEB_PORT:-8080}" --format '{{.ID}}' 2>/dev/null || true)
      if [ -n "$PORT_PID" ]; then
        echo "端口 ${WEB_PORT:-8080} 被容器 $PORT_PID 占用，正在清理..."
        $DOCKER stop $PORT_PID 2>/dev/null || true
        $DOCKER rm $PORT_PID 2>/dev/null || true
      else
        echo "端口 ${WEB_PORT:-8080} 未被占用"
      fi

      # ================================================================
      # 第 4 步：使用 backend:build_images 在同一台 NAS 上已构建的
      #          All-in-One 镜像（shipyard:latest）
      # ================================================================
      echo "=== 4. 使用 All-in-One 镜像 ==="
      DEPLOY_IMAGE="${API_IMAGE_NAME}:${IMAGE_TAG}"
      if $DOCKER images -q ${DEPLOY_IMAGE} >/dev/null 2>&1; then
        echo "✓ 镜像 ${DEPLOY_IMAGE} 已存在（由 backend:build_images 构建），直接部署"
      else
        # 镜像不存在才回退到本机构建；前端产物已由 frontend:build_web 的
        # artifacts 传入（Dockerfile.cn 不再在容器内编译 Flutter）
        if [ ! -f frontend/build/web/index.html ]; then
          echo "错误：缺少前端构建产物 frontend/build/web，无法构建镜像"
          exit 1
        fi
        echo "镜像不存在，执行构建..."
        $DOCKER build -f Dockerfile.cn \
          --build-arg PIP_INDEX_URL=${PIP_INDEX_URL} \
          -t ${DEPLOY_IMAGE} \
          . || { echo "错误：Docker 镜像构建失败"; exit 1; }
      fi

      echo "可用镜像："
      $DOCKER images | grep ${API_IMAGE_NAME}

      # ================================================================
      # 第 5 步：启动 All-in-One 容器
      # ================================================================
      # 映射到 nginx（容器内 80 端口），由 nginx 代理 API 到本地 uvicorn（127.0.0.1:8000）
      echo "=== 5. 启动 shipyard 容器 ==="
      $DOCKER run -d \
        --name shipyard \
        --restart unless-stopped \
        -p ${WEB_PORT:-8080}:80 \
        -e ADMIN_USER=${ADMIN_USER:-admin} \
        -e ADMIN_PASSWORD=${ADMIN_PASSWORD:-password} \
        -e IGNORED_EVENTS=${IGNORED_EVENTS:-exec_create,exec_start,exec_die} \
        -e HOST_FILESYSTEM_ROOT=/hostfs \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v /volume2/docker/mobile_portainer/data:/app/data \
        -v /:/hostfs:ro \
        -v /proc:/hostfs/proc:ro \
        ${DEPLOY_IMAGE} || { echo "错误：容器启动失败"; exit 1; }

      # ================================================================
      # 第 6 步：等待服务就绪
      # ================================================================
      echo "=== 6. 等待服务就绪 ==="
      sleep 5
      HEALTHY=false
      for i in $(seq 1 12); do
        if curl -sf http://localhost:${WEB_PORT:-8080} > /dev/null 2>&1; then
          echo "✓ 服务就绪 (${i}s)"
          HEALTHY=true
          break
        fi
        echo "  等待中... (${i}s)"
        sleep 1
      done

      # ================================================================
      # 第 7 步：验证部署结果
      # ================================================================
      echo "=== 7. 验证部署 ==="
      if [ "$HEALTHY" = true ]; then
        echo "✓ 部署成功！应用运行在 http://<synology-ip>:${WEB_PORT:-8080}"
        echo ""
        echo "=== 容器状态 ==="
        $DOCKER ps --filter "name=shipyard" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
      else
        echo "警告：容器已启动但 HTTP 健康检查未通过"
        echo ""
        echo "=== 容器状态 ==="
        $DOCKER ps -a --filter "name=shipyard" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
        echo ""
        echo "=== 容器日志（最后 30 行）==="
        $DOCKER logs shipyard --tail 30 2>/dev/null || true
      fi

      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [deploy_to_synology] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="
