# ================================================================
# Shipyard 统一 CI/CD 流水线
#
# 涵盖前端 (Flutter) 和后端 (Python FastAPI) 的全部检查、测试、
# 构建和部署任务。各阶段内部最大化并行执行，部署阶段等待所有
# 上游任务通过后才触发。
#
# Stage 拓扑（依赖关系）：
#
#   analyze（并行）          test（并行）             build           deploy
#   ┌───────────────┐        ┌───────────────────┐
#   │ frontend:analyze ─────► frontend:build_web ──► frontend:selenium_tests ─┐
#   │   (语法分析)    │        (Flutter build web)                              │
#   ├───────────────┤        ├───────────────────┤                            │
#   │               │        │ frontend:test     │                            │
#   │               │        │ backend:test      │                            │
#   └───────────────┘        └───────────────────┘                            ▼
#                                                                     build_images
#                                                                   (All-in-One Docker)
#                                                                             ▼
#                                                   deploy_to_synology ──► deploy_to_code01
#                                                   (NAS 部署, 并行)   (code01 本地构建)
#                                                                             ▼
#                                                            frontend:selenium_tests_prod
#                                                             (生产环境冒烟测试, code01)
#
# 说明：
#   - 第一阶段 analyze：frontend:analyze（语法分析）通过后 frontend:build_web 才开始构建
#   - 第二阶段 test：frontend:test / backend:test / frontend:selenium_tests 并行
#     （selenium_tests 依赖 build_web 的构建产物）
#   - 第三阶段 build_images：必须等第一阶段 + 第二阶段全部 5 个 job 成功后才运行，
#     前两阶段任一 job 失败则流水线失败，不进入 build 阶段
#   - 第四阶段 deploy：build_images 完成后才部署；fallback 构建还需要
#     frontend:build_web 的 artifacts（Dockerfile.cn 不在容器内编译 Flutter）。
#     deploy_to_synology（NAS，使用 build_images 构建的镜像）与
#     deploy_to_code01（code01 本地构建镜像后部署）并行执行，互不依赖
#   - 第五阶段 deploy_test：deploy_to_synology 部署成功后才执行生产环境
#     只读冒烟测试（frontend:selenium_tests_prod，在 code01 上直接运行）
# ================================================================

stages:
  - analyze
  - test
  - build
  - deploy
  - deploy_test

# ================================================================
# 全局变量（前后端合并去重）
# ================================================================
variables:
  # NAS 上 BuildKit 不稳定（git 信息探测、daemon 层提交间歇性卡死），
  # 全部 docker build 强制使用 legacy builder（DOCKER_BUILDKIT=0）。
  # BUILDKIT_GITINFO_DISABLE 保留：万一某处显式启用 BuildKit 时兜底。
  DOCKER_BUILDKIT: "0"
  BUILDKIT_GITINFO_DISABLE: "1"
  BUILDX_GIT_INFO: "0"
  GIT_CLEAN_FLAGS: none

  # ----------------------------------------------------------
  # 前端 —— 路径 / SDK 变量
  # ----------------------------------------------------------
  HVIGOR_USER_HOME: 'C:\hvigor_home'
  NODEJS_HOME: 'D:\nodejs'
  HOS_SDK_HOME: '/home/ckd/hos-sdk'

  # ----------------------------------------------------------
  # 前端 —— 镜像 / 注册表地址
  # ----------------------------------------------------------
  NODEJS_VERSION: 'v20.18.0'
  NODEJS_DOWNLOAD_URL: 'https://npmmirror.com/mirrors/node'
  PUB_HOSTED_URL: 'https://pub.flutter-io.cn'
  FLUTTER_STORAGE_BASE_URL: 'https://storage.flutter-io.cn'
  NPM_REGISTRY_URL: 'https://registry.npmmirror.com'

  # ----------------------------------------------------------
  # 前端 —— 行为开关
  # ----------------------------------------------------------
  HVIGOR_USER_HOME_AUTO_CREATE: 'true'
  NODEJS_AUTO_INSTALL: 'true'

  # ----------------------------------------------------------
  # 后端 —— 镜像 / 注册表地址
  # ----------------------------------------------------------
  PIP_INDEX_URL: "https://pypi.tuna.tsinghua.edu.cn/simple"

  # ----------------------------------------------------------
  # 后端 —— 构建变量（All-in-One 镜像）
  # ----------------------------------------------------------
  API_IMAGE_NAME: "shipyard"
  IMAGE_TAG: "latest"
  WEB_DOWNLOAD_BASE: "https://github.com"

  # ----------------------------------------------------------
  # 部署变量（All-in-One docker-compose 方式）
  # ----------------------------------------------------------
  WEB_PORT: '8080'
  # MCP 服务器对外可达的 HTTPS 入口（https://home.chenkaidi.top:507 为
  # NAS 端口转发：507 → 容器 8080）。不设置时 config.py 默认
  # PUBLIC_BASE_URL=http://127.0.0.1:8000，MCP 401 响应头返回
  # resource_metadata 指向客户端本机，Claude Code OAuth 认证断裂。
  PUBLIC_BASE_URL: 'https://home.chenkaidi.top:507'

  # 管理凭据
  ADMIN_USER: "admin"
  ADMIN_PASSWORD: "password"

# ================================================================
# 公共配置
# ================================================================

# --- 前端公共配置 ---
.frontend_setup:
  before_script:
    - cd frontend
    - |
      set +e
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      echo "CI env: PUB_HOSTED_URL = $PUB_HOSTED_URL"
      export HOS_SDK_HOME="${HOS_SDK_HOME:-/home/ckd/hos-sdk}"
      export PATH="$HOME/flutter/bin:$HOME/fvm/default/bin:/usr/local/flutter/bin:$PATH"
      echo "PATH setup done"

# --- 后端公共配置 ---
.backend_setup:
  before_script:
    - cd backend
    - |
      set +e
      echo "=== 环境信息 ==="
      echo "CI_PROJECT_DIR: $CI_PROJECT_DIR"
      echo "Python 版本: $(python3 --version 2>/dev/null || echo '未安装')"
      echo "Docker 版本: $(docker --version 2>/dev/null || echo '未安装')"

# ================================================================
# Stage: analyze —— 第一阶段：语法分析（前端静态检查 & Web 构建）
# ================================================================

# --- 前端：Flutter 静态分析（职责单一，只做 analyze）---
frontend:analyze:
  extends: .frontend_setup
  stage: analyze
  tags:
    - harmony
    - flutter
  script:
    - JOB_START_TIME=$(date +%s)
    - flutter pub get
    - flutter analyze --no-fatal-warnings --no-fatal-infos
    - |
      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [frontend:analyze] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="

# --- 前端：Flutter 单元测试（与 analyze 拆分，独立 job 并行执行）---
frontend:test:
  extends: .frontend_setup
  stage: test
  tags:
    - harmony
    - flutter
  script:
    - JOB_START_TIME=$(date +%s)
    - flutter pub get
    - flutter test
    - |
      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [frontend:test] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="

# --- 后端：Python 单元测试（使用 uv 高速包管理器）---
# 在 gitlab-runner 机器（code01）上直接运行（shell executor），
# 不依赖 Docker，不再调度到 NAS 上执行。
backend:test:
  extends: .backend_setup
  stage: test
  tags:
    - linux
    - code01
  timeout: 40m
  cache:
    key: uv-cache-${CI_COMMIT_REF_SLUG}
    paths:
      - backend/.uv-cache/
    policy: pull-push
  script:
    - JOB_START_TIME=$(date +%s)
    - |
      set -e

      # uv 缓存目录（CI 缓存持久化，加速后续构建）
      export UV_CACHE_DIR="$CI_PROJECT_DIR/backend/.uv-cache"

      STEP1_START=$(date +%s)
      echo "=== 1. 安装 uv（Rust 实现的高速 Python 包管理器）==="
      # PEP 668 保护阻止系统级 pip install，使用 --break-system-packages
      # CI 环境不是生产系统，此操作安全
      pip install uv -i ${PIP_INDEX_URL} -q --break-system-packages 2>/dev/null || \
        curl -LsSf https://astral.sh/uv/install.sh | sh
      # 确保 uv 在 PATH 中
      export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
      STEP1_END=$(date +%s)
      echo "⏱️  步骤1 (安装 uv) 用时: $((STEP1_END - STEP1_START)) 秒"

      STEP2_START=$(date +%s)
      echo "=== 2. 创建虚拟环境 ==="
      # shell executor 工作目录跨 job 持久化，先清理旧的 .venv
      rm -rf .venv
      uv venv .venv
      PYTHON=".venv/bin/python"
      STEP2_END=$(date +%s)
      echo "⏱️  步骤2 (创建虚拟环境) 用时: $((STEP2_END - STEP2_START)) 秒"

      STEP3_START=$(date +%s)
      echo "=== 3. 安装项目依赖（uv 并行下载+安装，比 pip 快 10-100 倍）==="
      uv pip install -r requirements.txt -i ${PIP_INDEX_URL}
      STEP3_END=$(date +%s)
      echo "⏱️  步骤3 (安装项目依赖) 用时: $((STEP3_END - STEP3_START)) 秒"

      STEP4_START=$(date +%s)
      echo "=== 4. 运行 pytest ==="
      $PYTHON -m pytest tests/ -v --tb=short
      STEP4_END=$(date +%s)
      echo "⏱️  步骤4 (运行 pytest) 用时: $((STEP4_END - STEP4_START)) 秒"

      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [backend:test] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="
      echo ""
      echo "========== 各步骤耗时汇总 =========="
      echo "  步骤1 (安装 uv):          $((STEP1_END - STEP1_START)) 秒"
      echo "  步骤2 (创建虚拟环境):     $((STEP2_END - STEP2_START)) 秒"
      echo "  步骤3 (安装项目依赖):     $((STEP3_END - STEP3_START)) 秒"
      echo "  步骤4 (运行 pytest):      $((STEP4_END - STEP4_START)) 秒"
      echo "========================================="
  coverage: '/TOTAL.*\s+(\d+%)$/'

# ================================================================
# Stage: analyze —— 第一阶段：语法分析（前端 Web 构建）
# ================================================================

# --- 前端：Flutter build web（提供 Selenium 测试 & 部署产物）---
frontend:build_web:
  extends: .frontend_setup
  stage: analyze
  tags:
    - harmony
    - flutter
  # 前端代码质量关卡：语法分析通过后才构建
  needs:
    - job: frontend:analyze
  script:
    - JOB_START_TIME=$(date +%s)
    - flutter pub get
    - |
      # ----------------------------------------------------------
      # 版本号自动 +1（patch 版本 +1，build number +1）
      # ci/bump_version.py 修改并写回 pubspec.yaml；新版本号写入
      # version_info.txt 作为 artifact 传递到 deploy_to_synology
      # （build_web 在 code01、deploy 在 NAS，工作目录不共享）。
      # 版本号提交只在部署成功时由 deploy job 完成，本 job 不提交。
      # ----------------------------------------------------------
      NEW_VERSION=$(python3 ci/bump_version.py) || { echo "错误：版本号自动 +1 失败"; exit 1; }
      echo "✓ 版本号已递增: ${NEW_VERSION}"
      echo "${NEW_VERSION}" > version_info.txt
      # ----------------------------------------------------------
      # 构建时间注入（--dart-define 编译期常量，设置页面展示；
      # 本地开发构建无该 define 时页面自动隐藏）
      # ----------------------------------------------------------
      BUILD_TIME=$(date '+%Y-%m-%d %H:%M:%S')
      echo "构建时间: ${BUILD_TIME}"
      flutter build web --no-tree-shake-icons --no-wasm-dry-run --dart-define=BUILD_TIME="${BUILD_TIME}" || { echo "错误：Flutter Web 构建失败"; exit 1; }
    - |
      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [frontend:build_web] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="
  artifacts:
    paths:
      - frontend/build/web
      - frontend/version_info.txt
    expire_in: 1 day

# ================================================================
# Stage: build —— 第三阶段：构建 All-in-One Docker 镜像
# ================================================================

# --- 后端：构建 All-in-One Docker 镜像（runner 编译前端 + Python + nginx）---
build_images:
  extends: .backend_setup
  stage: build
  tags:
    - linux
    - docker
    - nas
  # ⚠️ 禁用 BuildKit（DOCKER_BUILDKIT=0）：NAS 上 BuildKit 频繁失败——
  #    1) 构建时自动注入 git 信息（BUILDKIT_GITINFO_DISABLE 只在 BuildKit 下生效，
  #       NAS 网络不稳时 gitinfo 探测卡顿拖慢构建/被环境超时杀掉）
  #    2) legacy builder 无 layer 快照提交阶段，规避 btrfs 层卡死
  #    legacy builder 不支持 --progress 参数，构建命令中不得携带
  variables:
    DOCKER_BUILDKIT: "0"
    BUILDKIT_GITINFO_DISABLE: "1"
  # 第三阶段门禁：必须等第一阶段（analyze + build_web）+ 第二阶段
  # （frontend:test / backend:test / selenium_tests）全部 5 个 job 成功后才开始，
  # 前两阶段任一 job 失败则流水线失败，build_images 不会运行
  needs:
    - job: frontend:analyze
    # 前端 Web 产物由 frontend:build_web 在 runner 机器上编译，通过 artifacts 传入
    - job: frontend:build_web
      artifacts: true
    - job: frontend:test
    - job: backend:test
    - job: frontend:selenium_tests
  timeout: 60m
  # NAS daemon 层提交间歇性卡死导致 job 被杀（374/381/382 均 unknown_failure，
  # 构建器无关）。GitLab 自动重试：unknown_failure 重试即过（382 实测重试 9s 成功）
  retry:
    max: 2
    when:
      - unknown_failure
      - runner_system_failure
  script:
    - JOB_START_TIME=$(date +%s) && echo "$JOB_START_TIME" > /tmp/job_start_time_${CI_JOB_ID}.txt
    - echo "=== 检查前端构建产物 ==="
    # artifact 下载到仓库根目录；.backend_setup 已 cd backend，所以用 ../ 访问
    - ls -la ../frontend/build/web/index.html
    # 产物打包成单个 tar.gz（Dockerfile.cn 改为 COPY 单文件——目录 COPY
    # 曾导致 NAS docker daemon 卡死被杀，见 360 流水线 unknown_failure）
    - echo "=== 打包前端产物 ==="
    # 压缩级别平衡：gzip 默认 -6 压缩 14MB 产物可耗时 60s+ 且无日志
    # 输出，触发 trace 上传 403 取消 job（438 流水线连续四次失败）；
    # 不压缩则 web.tar.gz 达 40MB，docker build 上下文过大导致 NAS
    # daemon 卡死（440 流水线两次 script_failure/unknown_failure）。
    # 用 GZIP=-1 快速压缩（5-15s 完成、输出 ~8-10MB）+ -v 逐文件输出
    # 保持日志活跃，timeout 90 兜底。
    - GZIP=-1 timeout 90 tar -czvf ../frontend/build/web.tar.gz -C ../frontend/build web && ls -lh ../frontend/build/web.tar.gz
    - echo "=== 预拉取基础镜像（诊断 + 超时 + 多源重试）==="
    # NAS 资源/网络不稳时 docker pull 可能长时间无输出后被 runner 杀掉
    # （unknown_failure：#19 135s / #20 68s / 358: 66s / 359: 65s）。
    # 策略：先输出 NAS 磁盘/daemon 诊断（失败日志里定位原因），
    # 主源 timeout 120 拉取失败后自动换备用镜像源 docker.1panel.live
    # （tag 成主源名保证 Dockerfile 的 FROM 命中本地镜像），全部失败才 exit 1。
    - |
      BASE_IMAGE="docker.1ms.run/python:3.11-slim"

      # ---- docker 命令统一走 sudo ----
      # 实测：gitlab-runner 用户直接运行 docker 命令会间歇性卡死（358/359/
      # 360/361 的 unknown_failure 均由此引发，docker system df 必现卡死，
      # 裸 docker info 也会卡），sudo docker 运行正常。直接写 sudo docker
      # （不用 $DOCKER 变量——test_gitlab_ci_config.py 的正则按字面
      # "docker build" 匹配，变量会破坏断言），并保留 timeout 保护
      # （-k 兜底 SIGKILL，超时后返回失败而非挂死）。
      # ---- daemon 健康探测 ----
      # 任何 docker 操作前先快速探测，无响应则重试 3 次，仍失败就输出
      # NAS 诊断并快速失败，而不是挂到被环境杀死。
      echo "--- 探测 docker daemon 健康状态（sudo docker）---"
      DAEMON_OK=false
      for attempt in 1 2 3; do
        echo "daemon 探测 $attempt/3"
        if timeout -k 5 15 sudo docker info >/dev/null 2>&1; then
          DAEMON_OK=true
          echo "✓ docker daemon 响应正常"
          break
        fi
        echo "daemon 无响应（第 $attempt 次），10 秒后重试..."
        sleep 10
      done
      if [ "$DAEMON_OK" = false ]; then
        echo "错误：docker daemon 持续无响应（sudo docker 也失败），job 快速失败"
        echo "--- NAS 侧诊断 ---"
        free -h 2>/dev/null || true
        df -h /var/lib/docker 2>/dev/null || df -h / 2>/dev/null | head -3
        echo "--- NAS 排查指引（SSH 到 NAS 执行）---"
        echo "  1) gitlab-runner 用户是否在 docker 组： id gitlab-runner"
        echo "  2) docker.sock 权限：                  ls -la /var/run/docker.sock"
        echo "  3) 是否 OOM 杀进程：                   dmesg | grep -i -E 'oom|killed process' | tail -20"
        echo "  4) 重启 docker：                       sudo systemctl restart docker（会停止所有容器，慎用）"
        exit 1
      fi

      echo "--- NAS Docker 诊断 ---"
      df -h /var/lib/docker 2>/dev/null || df -h / 2>/dev/null | head -3
      # ⚠️ 不用 docker system df：NAS daemon 对该请求必现卡死（361/365 两次
      #    死于此，连 timeout 的 SIGKILL 都杀不掉卡死的 docker CLI，直到
      #    job 被环境杀死）。df -h 已提供磁盘信息，诊断信息足够。
      echo "--- 开始拉取基础镜像 ---"
      PULLED=false
      # 本地已有基础镜像则直接复用，跳过网络 pull：
      # NAS daemon 与 registry 通信时可能随机卡顿 40-60s 被环境杀死
      # （366 pull 卡 40s 侥幸恢复 / 367 pull 卡 60s 被杀，均停在尝试 1/3），
      # inspect 只与 daemon 本地通信、不触网，快且稳。
      if timeout -k 5 15 sudo docker image inspect "${BASE_IMAGE}" >/dev/null 2>&1; then
        echo "✓ 基础镜像已存在于本地，跳过拉取: ${BASE_IMAGE}"
        PULLED=true
      fi
      if [ "$PULLED" = false ]; then
        for source in "${BASE_IMAGE}" "docker.1panel.live/library/python:3.11-slim"; do
          for attempt in 1 2 3; do
            echo "尝试 [$source] $attempt/3"
            if timeout -k 5 120 sudo docker pull "${source}"; then
              PULLED=true
              break
            fi
            echo "拉取失败（第 $attempt 次），5 秒后重试..."
            sleep 5
          done
          if [ "$PULLED" = true ]; then
            if [ "${source}" != "${BASE_IMAGE}" ]; then
              sudo docker tag "${source}" "${BASE_IMAGE}"
              echo "✓ 备用源拉取成功，已 tag 为 ${BASE_IMAGE}"
            fi
            break
          fi
        done
      fi
      sudo docker image inspect "${BASE_IMAGE}" >/dev/null 2>&1 \
        || { echo "错误：基础镜像拉取失败（主源 + 备用源均失败）"; exit 1; }
      echo "✓ 基础镜像就绪: ${BASE_IMAGE}"
    - echo "=== 构建 All-in-One 镜像 ==="
    # 使用项目根目录的 All-in-One Dockerfile.cn（含 nginx + supervisord），
    # 而非 backend/Dockerfile.cn（纯后端，无 nginx）。
    # Flutter 前端已由 frontend:build_web 编译（不在 Docker 内编译），
    # Dockerfile.cn 直接 COPY frontend/build/web 产物。
    # .backend_setup 会 cd backend，所以用 ../ 回到项目根目录。
    # ⚠️ .backend_setup 设置了 set +e，docker build 失败不会自动中断脚本；
    #    必须显式 || exit 1，否则会静默使用 NAS 上残留的旧镜像部署（假绿 → 502）。
    #    自动重试：NAS daemon 层提交阶段间歇性卡死（360/364 两次均死在
    #    COPY frontend/nginx.conf 层，sudo 无法规避——疑似 btrfs 层快照卡顿，
    #    需 NAS 侧排查 daemon 日志/dmesg）。重试时前 8 层已 CACHED，成本低。
    - |
      BUILD_OK=false
      for attempt in 1 2; do
        echo "=== docker build 尝试 $attempt/2 ==="
        # ⚠️ 不带 --progress=plain：DOCKER_BUILDKIT=0 使用 legacy builder，
        #    该参数仅 BuildKit 支持，携带会导致构建直接报错
        # ⚠️ 必须用 sudo env 显式传 DOCKER_BUILDKIT/BUILDKIT_GITINFO_DISABLE：
        #    sudo 默认清空环境变量（env_reset），job 级 variables 注入的环境
        #    变量会被丢弃，直接 sudo docker build 仍会走 BuildKit
        #    （381 实测：日志 #0 building with "default" instance = BuildKit）
        if timeout -k 10 900 sudo env DOCKER_BUILDKIT=0 BUILDKIT_GITINFO_DISABLE=1 docker build -f ../Dockerfile.cn --build-arg PIP_INDEX_URL=${PIP_INDEX_URL} -t ${API_IMAGE_NAME}:${IMAGE_TAG} -t ${API_IMAGE_NAME}:latest ..; then
          BUILD_OK=true
          break
        fi
        echo "⚠️  构建失败/超时（第 $attempt 次）"
        # 重试前确认 daemon 存活（卡死后 daemon 可能已被环境杀掉）
        if ! timeout -k 5 15 sudo docker info >/dev/null 2>&1; then
          echo "错误：daemon 无响应，放弃重试"
          break
        fi
        echo "daemon 正常，10 秒后重试..."
        sleep 10
      done
      if [ "$BUILD_OK" = false ]; then
        echo "错误：Docker 镜像构建失败或超时（检查 .dockerignore 是否排除了前端产物；NAS daemon 层提交卡死需排查）"
        exit 1
      fi
    - echo "=== 镜像列表 ==="
    - sudo docker images | grep ${API_IMAGE_NAME}
    - echo "=== 验证镜像内容（nginx + 前端产物）==="
    # 构建成功不代表镜像健康：检查镜像内是否真有 nginx 和前端 index.html，
    # 防止"构建成功但产物缺失"的镜像被 deploy job 直接部署。
    - timeout -k 5 60 sudo docker run --rm ${API_IMAGE_NAME}:${IMAGE_TAG} sh -c 'test -f /usr/share/nginx/html/index.html && command -v nginx && echo "✓ 镜像包含 nginx + 前端产物" || { echo "错误：镜像缺少 nginx 或前端产物 index.html"; exit 1; }'
    - |
      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [build_images] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="
  after_script:
    - |
      if [ -f /tmp/job_start_time_${CI_JOB_ID}.txt ]; then
        JOB_END_TIME=$(date +%s)
        JOB_START_TIME=$(cat /tmp/job_start_time_${CI_JOB_ID}.txt)
        DURATION=$((JOB_END_TIME - JOB_START_TIME))
        echo "========================================="
        echo "⏱️  [build_images] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
        echo "========================================="
        rm -f /tmp/job_start_time_${CI_JOB_ID}.txt
      fi
      echo "构建完成"
      echo "  All-in-One 镜像: ${API_IMAGE_NAME}:${IMAGE_TAG}"

# ================================================================
# Stage: test —— 第二阶段：测试（前端 Selenium E2E）
# 在 gitlab-runner 机器（code01）上直接运行（shell executor），
# 不依赖 Docker，与 backend:test 相同模式。
# ================================================================

frontend:selenium_tests:
  stage: test
  timeout: 40m
  tags:
    - linux
    - code01
  # 只需 build_web 的构建产物，analyze/test 已通过 frontend:build_web 的门禁
  needs:
    - job: frontend:build_web
      artifacts: true
  cache:
    key: uv-cache-frontend-${CI_COMMIT_REF_SLUG}
    paths:
      - frontend/.uv-cache/
    policy: pull-push
  before_script:
    - cd frontend/selenium_tests
    - |
      set +e
      echo "=== 环境信息 ==="
      echo "CI_PROJECT_DIR: $CI_PROJECT_DIR"
      echo "Python 版本: $(python3 --version 2>/dev/null || echo '未安装')"
      CHROMIUM_BIN=$(command -v chromium || command -v chromium-browser || command -v google-chrome)
      echo "Chromium 版本: $($CHROMIUM_BIN --version 2>/dev/null || echo '未安装')"
      echo "ChromeDriver 版本: $(chromedriver --version 2>/dev/null || echo '未安装')"
  script:
    - JOB_START_TIME=$(date +%s) && echo "$JOB_START_TIME" > /tmp/job_start_time_${CI_JOB_ID}.txt
    - |
      set -e

      # uv 缓存目录（CI 缓存持久化，加速后续构建）
      export UV_CACHE_DIR="$CI_PROJECT_DIR/frontend/.uv-cache"

      STEP1_START=$(date +%s)
      echo "=== 1. 验证前端构建产物 ==="
      # artifact 下载到仓库根目录；before_script 已 cd frontend/selenium_tests
      ls -la ../build/web/index.html
      STEP1_END=$(date +%s)
      echo "⏱️  步骤1 (验证构建产物) 用时: $((STEP1_END - STEP1_START)) 秒"

      STEP2_START=$(date +%s)
      echo "=== 2. 安装 uv（Rust 实现的高速 Python 包管理器）==="
      # PEP 668 保护阻止系统级 pip install，使用 --break-system-packages
      # CI 环境不是生产系统，此操作安全
      pip install uv -i ${PIP_INDEX_URL} -q --break-system-packages 2>/dev/null || \
        curl -LsSf https://astral.sh/uv/install.sh | sh
      # 确保 uv 在 PATH 中
      export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
      STEP2_END=$(date +%s)
      echo "⏱️  步骤2 (安装 uv) 用时: $((STEP2_END - STEP2_START)) 秒"

      STEP3_START=$(date +%s)
      echo "=== 3. 创建虚拟环境 ==="
      # shell executor 工作目录跨 job 持久化，先清理旧的 .venv
      rm -rf .venv
      uv venv .venv
      PYTHON=".venv/bin/python"
      STEP3_END=$(date +%s)
      echo "⏱️  步骤3 (创建虚拟环境) 用时: $((STEP3_END - STEP3_START)) 秒"

      STEP4_START=$(date +%s)
      echo "=== 4. 安装项目依赖 ==="
      uv pip install -r requirements.txt -i ${PIP_INDEX_URL}
      STEP4_END=$(date +%s)
      echo "⏱️  步骤4 (安装项目依赖) 用时: $((STEP4_END - STEP4_START)) 秒"

      STEP5_START=$(date +%s)
      echo "=== 5. 准备浏览器环境 + 启动 mock backend ==="
      # 优先使用系统非 snap 版浏览器；snap 版 Chromium 在 CI/headless
      # 环境无法启动（Chrome instance exited），需改用下载的 CfT 版本
      SNAP_DETECTED=false
      if [ -x /snap/bin/chromium ]; then
        SNAP_DETECTED=true
        echo "  -> 检测到 snap 版 Chromium（CI 环境不可用），改用 Chrome for Testing"
      fi

      if [ "$SNAP_DETECTED" = false ]; then
        if command -v chromium >/dev/null 2>&1; then
          export CHROMIUM_BINARY=$(command -v chromium)
        elif command -v chromium-browser >/dev/null 2>&1; then
          export CHROMIUM_BINARY=$(command -v chromium-browser)
        elif command -v google-chrome >/dev/null 2>&1; then
          export CHROMIUM_BINARY=$(command -v google-chrome)
        fi
        if command -v chromedriver >/dev/null 2>&1; then
          export CHROMEDRIVER_PATH=$(command -v chromedriver)
        fi
      fi

      if [ -z "$CHROMIUM_BINARY" ]; then
        # 下载 Chrome for Testing（npmmirror 镜像，国内可访问）。
        # 浏览器与 chromedriver 同版本打包，天然匹配。
        # 下载目录位于 CI_PROJECT_DIR 下，shell executor 工作目录跨 job
        # 持久化，仅首次 job 需要下载（约 170MB）。
        CHROME_DIR="$CI_PROJECT_DIR/frontend/.chrome"
        CHROME_VER="150.0.7871.124"
        if [ ! -x "$CHROME_DIR/chrome-linux64/chrome" ]; then
          echo "  -> 下载 Chrome for Testing ${CHROME_VER}（仅首次）..."
          rm -rf "$CHROME_DIR"
          mkdir -p "$CHROME_DIR"
          curl -fL --retry 3 "https://registry.npmmirror.com/-/binary/chrome-for-testing/${CHROME_VER}/linux64/chrome-linux64.zip" -o /tmp/cft-chrome.zip
          curl -fL --retry 3 "https://registry.npmmirror.com/-/binary/chrome-for-testing/${CHROME_VER}/linux64/chromedriver-linux64.zip" -o /tmp/cft-driver.zip
          python3 -m zipfile -e /tmp/cft-chrome.zip "$CHROME_DIR"
          python3 -m zipfile -e /tmp/cft-driver.zip "$CHROME_DIR"
          rm -f /tmp/cft-chrome.zip /tmp/cft-driver.zip
        fi
        # python zipfile 解压不保留权限位，必须恢复所有可执行文件的
        # 执行权限（chrome、chromedriver、chrome_crashpad_handler 等）。
        # 放在下载判断之外，顺带修复已缓存但权限不完整的旧目录。
        chmod +x "$CHROME_DIR/chrome-linux64/"* "$CHROME_DIR/chromedriver-linux64/"* 2>/dev/null || true
        export CHROMIUM_BINARY="$CHROME_DIR/chrome-linux64/chrome"
        export CHROMEDRIVER_PATH="$CHROME_DIR/chromedriver-linux64/chromedriver"
        # 验证下载的 Chrome 可运行（系统可能缺少依赖库）
        if ! "$CHROMIUM_BINARY" --version >/dev/null 2>&1; then
          echo "FATAL: Chrome for Testing 无法运行（--version 失败）"
          ldd "$CHROMIUM_BINARY" 2>/dev/null | grep "not found" || true
          exit 1
        fi
        # 实际启动验证（headless dump-dom），失败时打印完整错误
        # 注意：Chrome 崩溃时被信号杀死（如 SIGTRAP/133），需 set +e 包裹，
        # 否则命令替换失败会直接终止脚本，无法打印诊断信息
        set +e
        DUMP_OUT=$("$CHROMIUM_BINARY" --headless=new --no-sandbox --disable-dev-shm-usage --dump-dom about:blank 2>&1)
        DUMP_EXIT=$?
        set -e
        if [ "$DUMP_EXIT" -eq 0 ] && echo "$DUMP_OUT" | grep -q "<html"; then
          echo "✓ Chrome headless 启动验证通过"
        else
          echo "FATAL: Chrome headless 启动验证失败 (exit=$DUMP_EXIT)，错误输出："
          echo "$DUMP_OUT" | tail -30
          echo ""
          echo "缺失的共享库（如有）："
          ldd "$CHROMIUM_BINARY" 2>/dev/null | grep "not found" || echo "  （未发现缺失库）"
          echo ""
          echo "解决：在 code01 上执行"
          echo "  sudo apt-get install -y libnss3 libgbm1 libasound2 libatk-bridge2.0-0 libatk1.0-0 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libcups2 libpango-1.0-0 libdrm2 libxcb-cursor0"
          exit 1
        fi
      fi
      echo "CHROMIUM_BINARY=$CHROMIUM_BINARY"
      echo "CHROMEDRIVER_PATH=$CHROMEDRIVER_PATH"

      # 清理可能残留的旧 mock backend（job 重试 / 上次异常退出）
      if [ -f "/tmp/mock_backend_pid_${CI_JOB_ID}.txt" ]; then
        kill "$(cat /tmp/mock_backend_pid_${CI_JOB_ID}.txt)" 2>/dev/null || true
        rm -f "/tmp/mock_backend_pid_${CI_JOB_ID}.txt"
      fi

      # 启动 mock backend（提供 Flutter Web 静态文件 + Portainer API mock）
      export MOCK_BACKEND_PORT=9000
      nohup $PYTHON mock_backend.py > "/tmp/mock_backend_${CI_JOB_ID}.log" 2>&1 &
      MOCK_PID=$!
      echo "$MOCK_PID" > "/tmp/mock_backend_pid_${CI_JOB_ID}.txt"
      echo "mock backend PID: $MOCK_PID，端口: $MOCK_BACKEND_PORT"

      # 等待 mock backend 就绪
      MOCK_READY=false
      for i in $(seq 1 30); do
        if curl -sf "http://localhost:${MOCK_BACKEND_PORT}/info" > /dev/null 2>&1; then
          echo "✓ mock backend 就绪 (${i}s)"
          MOCK_READY=true
          break
        fi
        sleep 1
      done
      if [ "$MOCK_READY" = false ]; then
        echo "FATAL: mock backend 启动失败，日志如下："
        tail -30 "/tmp/mock_backend_${CI_JOB_ID}.log" 2>/dev/null
        exit 1
      fi
      STEP5_END=$(date +%s)
      echo "⏱️  步骤5 (启动 mock backend) 用时: $((STEP5_END - STEP5_START)) 秒"

      STEP6_START=$(date +%s)
      echo "=== 6. 运行 pytest ==="
      set +e  # 禁用 exit-on-error，确保测试失败时也能执行清理
      export TEST_BASE_URL="http://localhost:${MOCK_BACKEND_PORT}"
      export MOCK_BACKEND_URL="http://localhost:${MOCK_BACKEND_PORT}"
      export TEST_BROWSER=chrome
      export TEST_HEADLESS=true
      # 避免本地代理干扰 ChromeDriver ↔ Chromium 通信
      export NO_PROXY="localhost,127.0.0.1,::1"
      export no_proxy="$NO_PROXY"

      REPORT_DIR="reports"
      rm -rf "$REPORT_DIR"
      mkdir -p "$REPORT_DIR"

      $PYTHON -m pytest tests/ -v --tb=long --html="$REPORT_DIR/report.html" --self-contained-html
      TEST_EXIT=$?
      set -e
      STEP6_END=$(date +%s)
      echo "⏱️  步骤6 (运行 pytest) 用时: $((STEP6_END - STEP6_START)) 秒"

      # 无论测试成功与否，都清理 mock backend
      if [ -f "/tmp/mock_backend_pid_${CI_JOB_ID}.txt" ]; then
        MOCK_PID=$(cat "/tmp/mock_backend_pid_${CI_JOB_ID}.txt")
        kill "$MOCK_PID" 2>/dev/null || true
        rm -f "/tmp/mock_backend_pid_${CI_JOB_ID}.txt"
      fi

      echo "Reports directory contents:"
      ls -la "$REPORT_DIR/" 2>/dev/null || echo "  (empty)"

      # 恢复原始测试退出码
      if [ $TEST_EXIT -ne 0 ]; then
        echo "Tests FAILED with exit code $TEST_EXIT"
        exit $TEST_EXIT
      fi
      echo "Tests PASSED"
    - |
      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [frontend:selenium_tests] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="
      echo ""
      echo "========== 各步骤耗时汇总 =========="
      echo "  步骤1 (验证构建产物):            $((STEP1_END - STEP1_START)) 秒"
      echo "  步骤2 (安装 uv):                 $((STEP2_END - STEP2_START)) 秒"
      echo "  步骤3 (创建虚拟环境):            $((STEP3_END - STEP3_START)) 秒"
      echo "  步骤4 (安装项目依赖):            $((STEP4_END - STEP4_START)) 秒"
      echo "  步骤5 (启动 mock backend):       $((STEP5_END - STEP5_START)) 秒"
      echo "  步骤6 (运行 pytest):             $((STEP6_END - STEP6_START)) 秒"
      echo "========================================="

  after_script:
    - |
      if [ -f /tmp/job_start_time_${CI_JOB_ID}.txt ]; then
        JOB_END_TIME=$(date +%s)
        JOB_START_TIME=$(cat /tmp/job_start_time_${CI_JOB_ID}.txt)
        DURATION=$((JOB_END_TIME - JOB_START_TIME))
        echo "========================================="
        echo "⏱️  [frontend:selenium_tests] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
        echo "========================================="
        rm -f /tmp/job_start_time_${CI_JOB_ID}.txt
      fi
    - |
      # 兜底清理：确保 mock backend 进程不残留（script 正常执行时已清理）
      if [ -f "/tmp/mock_backend_pid_${CI_JOB_ID}.txt" ]; then
        MOCK_PID=$(cat "/tmp/mock_backend_pid_${CI_JOB_ID}.txt")
        kill "$MOCK_PID" 2>/dev/null || true
        rm -f "/tmp/mock_backend_pid_${CI_JOB_ID}.txt"
      fi
  artifacts:
    when: always
    paths:
      - frontend/selenium_tests/reports/report.html
    expire_in: 7 days

# ================================================================
# Stage: deploy —— 第四阶段：All-in-One 部署（构建镜像 + 启动容器分开）
# ================================================================
deploy_to_synology:
  stage: deploy
  tags:
    - docker
    - nas
    - deploy
  # 第四阶段门禁：build_images（第三阶段）完成后才部署；
  # fallback 构建需要前端产物（Dockerfile.cn 不再在容器内编译 Flutter）
  needs:
    - job: build_images
    - job: frontend:build_web
      artifacts: true
  before_script:
    - |
      set +e
      echo "=== Docker 环境检查 ==="
      docker --version || { echo "错误：Docker CLI 不可用"; exit 1; }

      # ----------------------------------------------------------
      # 诊断：当前用户、socket 权限
      # ----------------------------------------------------------
      echo "当前用户: $(whoami), uid=$(id -u), groups=$(id -Gn)"
      echo "docker.sock 状态:"
      ls -la /var/run/docker.sock 2>/dev/null || echo "  /var/run/docker.sock 不存在"

      # ----------------------------------------------------------
      # 按优先级尝试 Docker 连接方式
      # ----------------------------------------------------------
      DOCKER="docker"
      # timeout 15：daemon 无响应时 docker info 会无限挂起（build_images 同款问题）
      if timeout 15 docker info >/dev/null 2>&1; then
        echo "✓ Docker daemon 连接正常（直接访问）"
      elif sudo -n chmod 666 /var/run/docker.sock 2>/dev/null && timeout 15 docker info >/dev/null 2>&1; then
        echo "✓ 通过 sudo 修复 socket 权限后连接正常"
      elif sudo -n timeout 15 docker info >/dev/null 2>&1; then
        DOCKER="sudo docker"
        echo "✓ Docker daemon 通过 sudo docker 连接正常"
      else
        echo ""
        echo "================================================"
        echo "错误：无法连接 Docker daemon！"
        echo ""
        echo "请在 NAS 上以 root 身份 SSH 执行以下命令："
        echo ""
        echo "  # 将 gitlab-runner 加入 docker 组（推荐方案）"
        echo "  sudo synogroup --add docker 2>/dev/null || true"
        echo "  sudo synogroup --member docker gitlab-runner"
        echo "  sudo chown root:docker /var/run/docker.sock"
        echo "  sudo chmod 660 /var/run/docker.sock"
        echo "  sudo systemctl restart gitlab-runner"
        echo ""
        echo "  # 备选方案：配置免密 sudo"
        echo "  echo 'gitlab-runner ALL=(ALL) NOPASSWD:/usr/local/bin/docker' > /etc/sudoers.d/gitlab-runner"
        echo "  chmod 440 /etc/sudoers.d/gitlab-runner"
        echo "================================================"
        exit 1
      fi

      echo "工作目录：$CI_PROJECT_DIR"
      echo "All-in-One 部署模式：docker build（构建）→ docker run（启动）"
  script:
    - |
      JOB_START_TIME=$(date +%s)

      # ================================================================
      # 第 1 步：清理旧的分离部署容器（向下兼容）
      # ================================================================
      echo "=== 1. 清理旧的分离部署容器 ==="
      $DOCKER stop mobile-portainer-web 2>/dev/null || true
      $DOCKER rm mobile-portainer-web 2>/dev/null || true
      $DOCKER stop mobile-portainer-api 2>/dev/null || true
      $DOCKER rm mobile-portainer-api 2>/dev/null || true

      # ================================================================
      # 第 2 步：停止旧的 all-in-one 容器
      # ================================================================
      echo "=== 2. 停止旧的 shipyard 容器 ==="
      $DOCKER stop shipyard 2>/dev/null || true
      $DOCKER rm shipyard 2>/dev/null || true

      # ================================================================
      # 第 3 步：检查端口占用
      # ================================================================
      echo "=== 3. 检查端口 ${WEB_PORT:-8080} 占用 ==="
      PORT_PID=$($DOCKER ps --filter "publish=${WEB_PORT:-8080}" --format '{{.ID}}' 2>/dev/null || true)
      if [ -n "$PORT_PID" ]; then
        echo "端口 ${WEB_PORT:-8080} 被容器 $PORT_PID 占用，正在清理..."
        $DOCKER stop $PORT_PID 2>/dev/null || true
        $DOCKER rm $PORT_PID 2>/dev/null || true
      else
        echo "端口 ${WEB_PORT:-8080} 未被占用"
      fi

      # ================================================================
      # 第 4 步：使用 build_images 在同一台 NAS 上已构建的
      #          All-in-One 镜像（shipyard:latest）
      # ================================================================
      echo "=== 4. 使用 All-in-One 镜像 ==="
      DEPLOY_IMAGE="${API_IMAGE_NAME}:${IMAGE_TAG}"
      if $DOCKER images -q ${DEPLOY_IMAGE} >/dev/null 2>&1; then
        echo "✓ 镜像 ${DEPLOY_IMAGE} 已存在（由 build_images 构建），直接部署"
      else
        # 镜像不存在才回退到本机构建；前端产物已由 frontend:build_web 的
        # artifacts 传入（Dockerfile.cn 不再在容器内编译 Flutter）
        if [ ! -f frontend/build/web/index.html ]; then
          echo "错误：缺少前端构建产物 frontend/build/web，无法构建镜像"
          exit 1
        fi
        echo "镜像不存在，执行构建..."
        # Dockerfile.cn 需要打包后的前端产物（单文件 COPY，避免 NAS daemon 卡死）；
        # GZIP=-1 快速压缩 + -v 逐文件输出（避免默认压缩级别静默 60s 被 trace
        # 403 取消，同时控制上下文大小避免 daemon 卡死）
        GZIP=-1 tar -czvf frontend/build/web.tar.gz -C frontend/build web || { echo "错误：前端产物打包失败"; exit 1; }
        $DOCKER build -f Dockerfile.cn \
          --build-arg PIP_INDEX_URL=${PIP_INDEX_URL} \
          -t ${DEPLOY_IMAGE} \
          . || { echo "错误：Docker 镜像构建失败"; exit 1; }
      fi

      echo "可用镜像："
      $DOCKER images | grep ${API_IMAGE_NAME}

      # ================================================================
      # 第 5 步：启动 All-in-One 容器
      # ================================================================
      # 映射到 nginx（容器内 80 端口），由 nginx 代理 API 到本地 uvicorn（127.0.0.1:8000）
      echo "=== 5. 启动 shipyard 容器 ==="
      $DOCKER run -d \
        --name shipyard \
        --restart unless-stopped \
        -p ${WEB_PORT:-8080}:80 \
        -e ADMIN_USER=${ADMIN_USER:-admin} \
        -e ADMIN_PASSWORD=${ADMIN_PASSWORD:-password} \
        -e PUBLIC_BASE_URL=${PUBLIC_BASE_URL} \
        -e IGNORED_EVENTS=${IGNORED_EVENTS:-exec_create,exec_start,exec_die} \
        -e HOST_FILESYSTEM_ROOT=/hostfs \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v /volume2/docker/mobile_portainer/data:/app/data \
        -v /:/hostfs:ro \
        -v /proc:/hostfs/proc:ro \
        ${DEPLOY_IMAGE} || { echo "错误：容器启动失败"; exit 1; }

      # ================================================================
      # 第 6 步：等待服务就绪
      # ================================================================
      # ⚠️ 健康检查不能用 curl http://localhost:${WEB_PORT}：
      #    gitlab-runner 是容器化的（Docker executor），runner 的
      #    localhost 是 runner 容器自身，而部署容器在 NAS 宿主机上，
      #    runner 仅通过 docker.sock 操作宿主机 daemon，网络层访问不到
      #    宿主机 localhost:8080（369 流水线实测：容器实际健康、用户
      #    访问正常，但 runner 侧 curl 12 次全失败）。
      #    改用 docker exec 进入容器内自测：容器内 localhost:80 直达
      #    nginx，与 runner 网络环境解耦。验证两项：
      #      1) HTTP GET / → 200（nginx + 前端产物可用）
      #      2) TCP 连接 127.0.0.1:8000 → 成功（uvicorn 进程在监听）
      #    ⚠️ 不能 HTTP 测 /info：该端点需 X-API-Key 认证，匿名请求返回
      #    401，urlopen 视为失败（372 流水线实测：部署健康但 /info 探测
      #    401 误判失败）。TCP 探测 8000 端口无需凭据即可验证 uvicorn。
      echo "=== 6. 等待服务就绪（docker exec 容器内自测）==="
      sleep 5
      HEALTHY=false
      for i in $(seq 1 12); do
        if $DOCKER exec shipyard python3 -c 'import urllib.request, socket; urllib.request.urlopen("http://localhost/", timeout=3); socket.create_connection(("127.0.0.1", 8000), timeout=3)' >/dev/null 2>&1; then
          echo "✓ 容器内服务就绪（nginx HTTP 200 + uvicorn 8000 监听）(${i}s)"
          HEALTHY=true
          break
        fi
        echo "  等待中... (${i}s)"
        sleep 1
      done

      # ================================================================
      # 第 7 步：验证部署结果
      # ================================================================
      echo "=== 7. 验证部署 ==="
      if [ "$HEALTHY" = true ]; then
        echo "✓ 部署成功！容器内健康检查通过（nginx HTTP 200 + uvicorn 8000 监听），应用运行在 http://<synology-ip>:${WEB_PORT:-8080}"
        echo ""
        echo "=== 容器状态 ==="
        $DOCKER ps --filter "name=shipyard" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

        # ================================================================
        # 第 8 步：部署成功后才提交版本号到 git 远程仓库
        # ================================================================
        # 版本号 +1 由 frontend:build_web 完成（ci/bump_version.py），新版本号
        # 通过 version_info.txt artifact 传入（build_web 在 code01、deploy 在
        # NAS，工作目录不共享，build_web 对 pubspec.yaml 的修改无法直接带过来）。
        # 只有部署成功（健康检查通过）才提交；失败分支直接 exit 1，不提交。
        # ⚠️ commit message 必须带 [skip ci]：否则版本号提交会触发新流水线
        #    → 又 +1 → 又提交，无限循环。
        echo "=== 8. 提交版本号到 git 远程仓库（部署成功才提交）==="
        if [ -f frontend/version_info.txt ]; then
          NEW_VERSION=$(cat frontend/version_info.txt)
          echo "新版本号: ${NEW_VERSION}"
          sed -i "s/^version: .*/version: ${NEW_VERSION}/" frontend/pubspec.yaml || { echo "错误：更新 pubspec.yaml 版本号失败"; exit 1; }
          git config user.name "CI Bot"
          git config user.email "ci-bot@shipyard.local"
          git add frontend/pubspec.yaml
          git commit -m "chore: 版本号自动 +1 至 ${NEW_VERSION} [skip ci]" || { echo "错误：版本号提交失败（可能无变更）"; exit 1; }
          PUSH_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@home.chenkaidi.top:509/chenkaidi/shipyard.git"
          if git push "${PUSH_URL}" HEAD:main; then
            echo "✓ 版本号已提交并推送到远程仓库: ${NEW_VERSION}"
          else
            echo "错误：版本号提交推送失败（部署已成功，但版本号未入库）"
            echo "  若提示权限不足：GitLab 15.9+ 默认 CI_JOB_TOKEN 只有只读权限，"
            echo "  请在项目 Settings > CI/CD > Token Access 放开 CI_JOB_TOKEN 写权限，"
            echo "  或配置 GIT_PUSH_TOKEN 变量后重跑本 job。"
            exit 1
          fi
        else
          echo "警告：未找到 frontend/version_info.txt（artifact 缺失），跳过版本号提交"
        fi
      else
        echo "警告：容器已启动但容器内 HTTP 健康检查未通过"
        echo ""
        echo "=== 容器状态 ==="
        $DOCKER ps -a --filter "name=shipyard" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
        echo ""
        echo "=== 容器内自测详情（nginx 静态 /）==="
        $DOCKER exec shipyard python3 -c 'import urllib.request; print("HTTP", urllib.request.urlopen("http://localhost/", timeout=3).getcode())' 2>&1 || true
        echo "=== 容器内自测详情（nginx→uvicorn 代理 /info）==="
        # /info 需要 X-API-Key 认证：401 是认证拒绝而非故障，502/超时才异常
        $DOCKER exec shipyard python3 -c 'import urllib.request; print("HTTP", urllib.request.urlopen("http://localhost/info", timeout=3).getcode())' 2>&1 || true
        echo ""
        echo "=== 容器日志（最后 30 行）==="
        $DOCKER logs shipyard --tail 30 2>/dev/null || true
        echo ""
        # ⚠️ 健康检查未通过必须使 job 失败（exit 1）：
        #    之前只打印警告，坏部署（如旧镜像缺少 nginx/前端）会静默上线，
        #    Job 显示 success，用户访问才看到 502。
        echo "错误：部署验证失败（容器内 HTTP 健康检查未通过），Job 标记为失败"
        exit 1
      fi

      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [deploy_to_synology] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="

# ================================================================
# Stage: deploy —— 第四阶段：部署到 code01（本地构建 + docker run）
# code01 是 shell executor 的 gitlab-runner 机器（与 backend:test /
# frontend:selenium_tests 同一台），无法访问 NAS 上 build_images 构建
# 的镜像，因此在 code01 本地用 CI artifacts 的前端产物构建 All-in-One
# 镜像后部署，与 NAS 部署完全解耦。
#
# ⚠️ 本 job 不做版本号提交：deploy_to_synology 部署成功后才负责 git
#    commit + push（两个 job 在 deploy 阶段并行，若都 sed pubspec.yaml
#    会冲突且重复提交）。code01 部署失败时 NAS 部署不受影响。
# ================================================================
deploy_to_code01:
  stage: deploy
  tags:
    - linux
    - code01
  # 与 deploy_to_synology 相同门禁：build_images（第三阶段）通过 +
  # 前端构建产物（code01 本地构建 Dockerfile.cn 需要）
  needs:
    - job: build_images
    - job: frontend:build_web
      artifacts: true
  # code01 上 Docker 29.x 的 legacy builder 无法启动构建容器（containerd
  # shim TTRPC 错误，449 流水线实测 failed to create TTRPC connection），
  # job 级覆盖启用 BuildKit。仅对本 job 生效，不影响 NAS 上 build_images
  # 的 DOCKER_BUILDKIT=0（NAS legacy builder 反而更稳定）。
  variables:
    DOCKER_BUILDKIT: "1"
  script:
    - |
      JOB_START_TIME=$(date +%s)

      # ================================================================
      # 第 0 步：Docker 连接探测 + 容器可运行预检
      # ⚠️ code01 上 gitlab-runner 用户直接运行 docker 无法启动容器
      #    （containerd shim TTRPC 错误，449/450 流水线实测：docker info
      #    正常但 docker run 必失败），必须用 sudo 运行（用户确认 code01
      #    已配置免密 sudo）。优先 sudo docker，回退直接访问。
      # ⚠️ daemon 通信正常 ≠ 能启动容器：预检用基础镜像 docker run 验证
      #    shim 可用，失败立即退出，避免白跑整个镜像构建。
      # ================================================================
      echo "=== Docker 环境检查 ==="
      docker --version || { echo "错误：Docker CLI 不可用"; exit 1; }
      DOCKER="sudo docker"
      if sudo -n timeout 15 docker info >/dev/null 2>&1; then
        echo "✓ Docker daemon 通过 sudo docker 连接正常"
      elif timeout 15 docker info >/dev/null 2>&1; then
        DOCKER="docker"
        echo "✓ Docker daemon 连接正常（直接访问，容器启动失败时需改用 sudo）"
      else
        echo ""
        echo "================================================"
        echo "错误：无法连接 Docker daemon！"
        echo "请在 code01 上以 root 身份执行："
        echo ""
        echo "  # 推荐方案：配置免密 sudo（code01 实测裸 docker 无法启动容器）"
        echo "  echo 'gitlab-runner ALL=(ALL) NOPASSWD:/usr/bin/docker' > /etc/sudoers.d/gitlab-runner"
        echo "  chmod 440 /etc/sudoers.d/gitlab-runner"
        echo ""
        echo "  # 备选方案：将 gitlab-runner 加入 docker 组"
        echo "  sudo usermod -aG docker gitlab-runner"
        echo "  sudo systemctl restart docker gitlab-runner"
        echo "================================================"
        exit 1
      fi
      echo "--- 验证容器可运行（${DOCKER} run --rm 基础镜像）---"
      BASE_IMAGE="docker.1ms.run/python:3.11-slim"
      if timeout -k 5 120 $DOCKER run --rm "${BASE_IMAGE}" true; then
        echo "✓ 容器可正常运行（containerd shim 正常）"
      else
        echo "错误：无法启动容器（containerd shim 故障），Job 提前失败"
        echo "  排查：sudo systemctl restart containerd docker；"
        echo "  若为 snap 版 docker：sudo snap remove docker && sudo apt-get install -y docker.io"
        exit 1
      fi

      # ================================================================
      # 第 1 步：检查前端构建产物 + 打包（Dockerfile.cn 单文件 COPY
      #         web.tar.gz，避免大量文件 COPY 卡死 daemon）
      # ================================================================
      echo "=== 1. 检查前端构建产物 ==="
      # artifact 下载到仓库根目录（本 job 工作目录即仓库根）
      ls -la frontend/build/web/index.html || { echo "错误：缺少前端构建产物 frontend/build/web"; exit 1; }
      GZIP=-1 timeout 90 tar -czvf frontend/build/web.tar.gz -C frontend/build web && ls -lh frontend/build/web.tar.gz

      # ================================================================
      # 第 2 步：构建 All-in-One 镜像（code01 本地，与 NAS 完全解耦）
      # ================================================================
      echo "=== 2. 构建 All-in-One 镜像 ==="
      DEPLOY_IMAGE="${API_IMAGE_NAME}:${IMAGE_TAG}"
      if [ "$DOCKER" = "docker" ]; then
        # 直接 docker（job 级变量 DOCKER_BUILDKIT=1 生效，自动走 BuildKit）
        docker build --progress=plain -f Dockerfile.cn --build-arg PIP_INDEX_URL=${PIP_INDEX_URL} -t ${DEPLOY_IMAGE} . || { echo "错误：Docker 镜像构建失败"; exit 1; }
      else
        # sudo docker：sudo 默认清空环境变量（env_reset），必须 sudo env
        # 显式传 DOCKER_BUILDKIT=1 启用 BuildKit（code01 legacy builder 不可用）
        sudo env DOCKER_BUILDKIT=1 BUILDKIT_GITINFO_DISABLE=1 docker build --progress=plain -f Dockerfile.cn --build-arg PIP_INDEX_URL=${PIP_INDEX_URL} -t ${DEPLOY_IMAGE} . || { echo "错误：Docker 镜像构建失败"; exit 1; }
      fi
      echo "=== 镜像列表 ==="
      $DOCKER images | grep ${API_IMAGE_NAME}
      echo "=== 验证镜像内容（nginx + 前端产物）==="
      timeout -k 5 60 $DOCKER run --rm ${DEPLOY_IMAGE} sh -c 'test -f /usr/share/nginx/html/index.html && command -v nginx && echo "✓ 镜像包含 nginx + 前端产物" || { echo "错误：镜像缺少 nginx 或前端产物 index.html"; exit 1; }'

      # ================================================================
      # 第 3 步：清理旧的 shipyard 容器 + 检查端口占用
      # ================================================================
      echo "=== 3. 清理旧的 shipyard 容器 ==="
      $DOCKER stop shipyard 2>/dev/null || true
      $DOCKER rm shipyard 2>/dev/null || true
      echo "=== 检查端口 ${WEB_PORT:-8080} 占用 ==="
      PORT_PID=$($DOCKER ps --filter "publish=${WEB_PORT:-8080}" --format '{{.ID}}' 2>/dev/null || true)
      if [ -n "$PORT_PID" ]; then
        echo "端口 ${WEB_PORT:-8080} 被容器 $PORT_PID 占用，正在清理..."
        $DOCKER stop $PORT_PID 2>/dev/null || true
        $DOCKER rm $PORT_PID 2>/dev/null || true
      else
        echo "端口 ${WEB_PORT:-8080} 未被占用"
      fi

      # ================================================================
      # 第 4 步：准备数据目录 + 启动 All-in-One 容器
      # ================================================================
      # 数据目录默认 gitlab-runner 用户家目录（与 NAS 的
      # /volume2/docker/mobile_portainer/data 区分，互不干扰），
      # 可通过 GitLab 变量 CODE01_DATA_DIR 覆盖。
      echo "=== 4. 启动 shipyard 容器（code01）==="
      CODE01_DATA_DIR="${CODE01_DATA_DIR:-$HOME/shipyard/data}"
      mkdir -p "${CODE01_DATA_DIR}"
      echo "数据目录: ${CODE01_DATA_DIR}"
      $DOCKER run -d \
        --name shipyard \
        --restart unless-stopped \
        -p ${WEB_PORT:-8080}:80 \
        -e ADMIN_USER=${ADMIN_USER:-admin} \
        -e ADMIN_PASSWORD=${ADMIN_PASSWORD:-password} \
        -e PUBLIC_BASE_URL=${PUBLIC_BASE_URL} \
        -e IGNORED_EVENTS=${IGNORED_EVENTS:-exec_create,exec_start,exec_die} \
        -e HOST_FILESYSTEM_ROOT=/hostfs \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v ${CODE01_DATA_DIR}:/app/data \
        -v /:/hostfs:ro \
        -v /proc:/hostfs/proc:ro \
        ${DEPLOY_IMAGE} || { echo "错误：容器启动失败"; exit 1; }

      # ================================================================
      # 第 5 步：等待服务就绪（docker exec 容器内自测）
      # 与 deploy_to_synology 相同：不能从 runner 侧 curl localhost（shell
      # executor 的 localhost 就是 code01 宿主，实际可达——但容器内自测
      # 更稳，且逻辑与 NAS 部署保持一致）。验证两项：
      #   1) HTTP GET / → 200（nginx + 前端产物可用）
      #   2) TCP 连接 127.0.0.1:8000 → 成功（uvicorn 进程在监听）
      # ================================================================
      echo "=== 5. 等待服务就绪（docker exec 容器内自测）==="
      sleep 5
      HEALTHY=false
      for i in $(seq 1 12); do
        if $DOCKER exec shipyard python3 -c 'import urllib.request, socket; urllib.request.urlopen("http://localhost/", timeout=3); socket.create_connection(("127.0.0.1", 8000), timeout=3)' >/dev/null 2>&1; then
          echo "✓ 容器内服务就绪（nginx HTTP 200 + uvicorn 8000 监听）(${i}s)"
          HEALTHY=true
          break
        fi
        echo "  等待中... (${i}s)"
        sleep 1
      done

      # ================================================================
      # 第 6 步：验证部署结果（健康检查未通过必须 exit 1，不能假绿）
      # ================================================================
      echo "=== 6. 验证部署 ==="
      if [ "$HEALTHY" = true ]; then
        echo "✓ 部署成功！容器内健康检查通过（nginx HTTP 200 + uvicorn 8000 监听），应用运行在 http://<code01-ip>:${WEB_PORT:-8080}"
        echo ""
        echo "=== 容器状态 ==="
        $DOCKER ps --filter "name=shipyard" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
      else
        echo "警告：容器已启动但容器内 HTTP 健康检查未通过"
        echo ""
        echo "=== 容器状态 ==="
        $DOCKER ps -a --filter "name=shipyard" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
        echo ""
        echo "=== 容器日志（最后 30 行）==="
        $DOCKER logs shipyard --tail 30 2>/dev/null || true
        echo "错误：部署验证失败（容器内 HTTP 健康检查未通过），Job 标记为失败"
        exit 1
      fi

      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [deploy_to_code01] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="

# ================================================================
# Stage: deploy_test —— 第五阶段：生产环境只读冒烟测试（部署后验证）
# 在 gitlab-runner 机器（code01）上直接运行（shell executor），与
# frontend:selenium_tests（本地 mock 环境）区分：直接访问刚部署的
# 生产环境（home.chenkaidi.top:507 / 10.0.0.122:8080），验证页面
# 渲染、登录、导航等只读冒烟项，确认线上可用后才算部署闭环完成。
# ================================================================

frontend:selenium_tests_prod:
  stage: deploy_test
  timeout: 40m
  tags:
    - linux
    - code01
  # 部署成功后才测试；部署失败时本 job 不运行（流水线已在 deploy 阶段失败）
  needs:
    - job: deploy_to_synology
  before_script:
    - cd frontend/selenium_tests_prod
    - |
      set +e
      echo "=== 环境信息 ==="
      echo "CI_PROJECT_DIR: $CI_PROJECT_DIR"
      echo "Python 版本: $(python3 --version 2>/dev/null || echo '未安装')"
      CHROMIUM_BIN=$(command -v chromium || command -v chromium-browser || command -v google-chrome)
      echo "Chromium 版本: $($CHROMIUM_BIN --version 2>/dev/null || echo '未安装')"
      echo "ChromeDriver 版本: $(chromedriver --version 2>/dev/null || echo '未安装')"
  script:
    - JOB_START_TIME=$(date +%s) && echo "$JOB_START_TIME" > /tmp/job_start_time_${CI_JOB_ID}.txt
    - |
      set -e

      # ---- 登录凭据注入 ----
      # 优先 GitLab CI/CD 项目变量 TEST_USERNAME / TEST_PASSWORD（生产真实凭据，
      # 建议在 Settings > CI/CD > Variables 配置）；缺省回退到部署凭据
      # ADMIN_USER / ADMIN_PASSWORD（与 deploy_to_synology 注入容器的凭据一致）。
      # 多套环境密码不同时，额外配置 TEST_USERNAME_<host> / TEST_PASSWORD_<host>
      # （host 中 . 替换为 _，见 config.per_host_creds）。凭据全部缺失时
      # 登录相关测试自动跳过（pytest -rs 显示原因），冒烟测试仍执行。
      export TEST_USERNAME="${TEST_USERNAME:-${ADMIN_USER}}"
      export TEST_PASSWORD="${TEST_PASSWORD:-${ADMIN_PASSWORD}}"

      # ---- 浏览器探测 ----
      # ⚠️ code01 的系统 chromium 是 snap 版（/snap/bin/chromium），在 CI/headless
      # 环境无法启动（Chrome instance exited，428 流水线实测全 skip），必须排除。
      # 探测顺序：CI 变量 CHROMIUM_BINARY → 非 snap 系统 chromium → 复用
      # frontend:selenium_tests 下载缓存的 Chrome for Testing（frontend/.chrome
      # 在 code01 shell executor 工作目录跨 job 持久化）。使用 CfT 时 chromedriver
      # 同步指到 CfT 自带 driver（与浏览器同版本，天然匹配）。
      if [ -n "${CHROMIUM_BINARY:-}" ] && [ -x "${CHROMIUM_BINARY}" ]; then
        echo "✓ 使用 CI 变量指定的浏览器: $CHROMIUM_BINARY"
      else
        for c in chromium chromium-browser google-chrome; do
          BIN=$(command -v "$c" 2>/dev/null || true)
          if [ -n "$BIN" ] && [[ "$BIN" != /snap/* ]] && [ -x "$BIN" ]; then
            export CHROMIUM_BINARY="$BIN"
            echo "✓ 使用系统 $c（非 snap）: $BIN"
            break
          fi
        done
      fi
      if [ -z "${CHROMIUM_BINARY:-}" ]; then
        if [ -x "$CI_PROJECT_DIR/frontend/.chrome/chrome-linux64/chrome" ]; then
          export CHROMIUM_BINARY="$CI_PROJECT_DIR/frontend/.chrome/chrome-linux64/chrome"
          export CHROMEDRIVER_PATH="$CI_PROJECT_DIR/frontend/.chrome/chromedriver-linux64/chromedriver"
          echo "✓ 使用 selenium_tests 缓存的 Chrome for Testing: $CHROMIUM_BINARY"
        fi
      fi
      if [ -z "${CHROMIUM_BINARY:-}" ]; then
        echo "错误：未找到可用 Chrome/Chromium 浏览器（snap 版不可用）。"
        echo "  解决：先运行 frontend:selenium_tests 下载 Chrome for Testing 缓存，"
        echo "  或在 code01 安装非 snap 版 chromium，或在 GitLab CI/CD 变量配置 CHROMIUM_BINARY。"
        exit 1
      fi
      "$CHROMIUM_BINARY" --version
      if [ -n "${CHROMEDRIVER_PATH:-}" ] && [ -x "$CHROMEDRIVER_PATH" ]; then
        "$CHROMEDRIVER_PATH" --version || true
      fi

      # ---- 运行生产环境只读冒烟测试 ----
      # run_tests.sh 内部自动处理 NO_PROXY（避免本地代理干扰 ChromeDriver ↔ Chrome）
      echo "=== 运行 selenium_tests_prod（默认生产环境 + 登录测试）==="
      set +e  # 禁用 exit-on-error，确保测试失败时也能输出完整日志
      ./run_tests.sh --html > pytest_output.log 2>&1
      RUN_EXIT=$?
      set -e
      cat pytest_output.log

      if [ $RUN_EXIT -ne 0 ]; then
        echo "Tests FAILED with exit code $RUN_EXIT"
        exit $RUN_EXIT
      fi
      # 假绿防护：pytest 对生产环境不可达 / 浏览器启动失败 / 凭据缺失时自动
      # skip。仅 grep "passed" 不够——浏览器全崩时 test_wasm_retry 的 2 个纯
      # 单元测试仍会通过（428 流水线实测假绿）。改为统计通过用例数：
      # 正常情况 = 2 个单元测试 + 2 环境 × 5 个浏览器测试 = 12+；浏览器全
      # 挂时 = 2。通过数 < 4 说明线上验证未实际执行，必须标记失败。
      PASSED_COUNT=$(grep -oE "[0-9]+ passed" pytest_output.log | tail -1 | grep -oE "^[0-9]+" || true)
      if [ -z "$PASSED_COUNT" ] || [ "$PASSED_COUNT" -lt 4 ]; then
        echo "错误：通过用例过少（passed=${PASSED_COUNT:-0}），浏览器测试可能全部失败/跳过，Job 标记为失败"
        echo "  排查：code01 浏览器环境（snap chromium 不可用需 CfT 缓存），"
        echo "        以及生产环境可达性（https://home.chenkaidi.top:507 / http://10.0.0.122:8080）"
        exit 1
      fi
      echo "Tests PASSED (passed=$PASSED_COUNT)"
    - |
      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [frontend:selenium_tests_prod] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="
  after_script:
    - |
      if [ -f /tmp/job_start_time_${CI_JOB_ID}.txt ]; then
        JOB_END_TIME=$(date +%s)
        JOB_START_TIME=$(cat /tmp/job_start_time_${CI_JOB_ID}.txt)
        DURATION=$((JOB_END_TIME - JOB_START_TIME))
        echo "========================================="
        echo "⏱️  [frontend:selenium_tests_prod] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
        echo "========================================="
        rm -f /tmp/job_start_time_${CI_JOB_ID}.txt
      fi
  artifacts:
    when: always
    paths:
      - frontend/selenium_tests_prod/report.html
      - frontend/selenium_tests_prod/pytest_output.log
    expire_in: 7 days
