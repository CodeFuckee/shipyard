version: '3.8'

services:
  api:
    build: .
    environment:
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-password}
      - IGNORED_EVENTS=${IGNORED_EVENTS:-exec_create,exec_start,exec_die}
      - HOST_FILESYSTEM_ROOT=/hostfs
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Mobile Portainer}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-false}
      - SMTP_USE_STARTTLS=${SMTP_USE_STARTTLS:-true}
      - SMTP_TIMEOUT=${SMTP_TIMEOUT:-10}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - /:/hostfs:ro
      - /proc:/hostfs/proc:ro
    restart: unless-stopped
    container_name: mobile-portainer-api
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
    container_name: mobile-portainer-web
