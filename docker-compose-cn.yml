version: '3.8'

services:
  shipyard:
    build:
      context: .
      dockerfile: Dockerfile.cn
      args:
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - HTTP_PROXY=${HTTP_PROXY:-}
    environment:
      # 管理后台登录
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-password}
      # Docker 事件过滤
      - IGNORED_EVENTS=${IGNORED_EVENTS:-exec_create,exec_start,exec_die}
      # 主机文件系统
      - HOST_FILESYSTEM_ROOT=/hostfs
      # SMTP 邮件配置
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Mobile Portainer}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-false}
      - SMTP_USE_STARTTLS=${SMTP_USE_STARTTLS:-true}
      - SMTP_TIMEOUT=${SMTP_TIMEOUT:-10}
    volumes:
      # Docker 引擎通信
      - /var/run/docker.sock:/var/run/docker.sock
      # 应用数据持久化
      - ./data:/app/data
      # 主机文件系统（只读）
      - /:/hostfs:ro
      - /proc:/hostfs/proc:ro
    ports:
      # 映射到 nginx（容器内 80 端口），由 nginx 代理 API 请求到本地 uvicorn（127.0.0.1:8000）
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
    container_name: shipyard
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
